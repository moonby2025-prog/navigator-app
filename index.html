        // --- HELPERS ---
        const safeJsonParse = (key, fallback) => {
            try {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : fallback;
            } catch (e) {
                console.error(`Error parsing ${key} from localStorage`, e);
                return fallback;
            }
        };

        const formatNumber = (num) => {
            if (num === null || num === undefined || isNaN(num)) return '0';
            return Math.round(num).toLocaleString('ko-KR');
        };
        const formatManwon = (num) => {
            if (num === null || num === undefined || isNaN(num)) return '0원';
            return Math.round(num / 10000).toLocaleString('ko-KR') + '만원';
        };
        const parseFormattedNumber = (val) => parseFloat(String(val).replace(/,/g, '')) || 0;
        const calculateKgPrice = (don) => (parseFormattedNumber(don) * (1000 / 3.75));
        const getPremiumColor = (val) => val < 0 ? 'text-blue-500' : val < 5 ? 'text-slate-900 dark:text-white' : val < 10 ? 'text-green-500' : 'text-red-500';

        // --- COMPONENTS ---
        const AppleCard = ({ title, subTitle, children, className = "", rightContent = null, onExpand = null }) => (
            <div className={`apple-card ${className}`}>
                {(title || rightContent) && (
                    <div className="flex justify-between items-center mb-4 flex-shrink-0">
                        <div className="min-w-0 mr-2">
                            {title && <h3 className="text-lg font-bold text-slate-900 dark:text-white truncate">{title}</h3>}
                            {subTitle && <div className="text-xs font-medium text-gray-400 truncate">{subTitle}</div>}
                        </div>
                        <div className="flex items-center gap-1 flex-shrink-0">{rightContent}{onExpand && <button onClick={onExpand} className="w-8 h-8 rounded-full bg-gray-100 dark:bg-[#3A3A3C] flex items-center justify-center text-slate-500 hover:bg-gray-200"><i className="fa-solid fa-expand text-xs"></i></button>}</div>

                )}

        );

        const MiniChart = memo(({ symbol, theme }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (!ref.current) return; ref.current.innerHTML = '';
                const div = document.createElement('div'); div.className = 'tradingview-widget-container h-full w-full';
                div.innerHTML = `<div class="tradingview-widget-container__widget h-full w-full"></div>`;
                const script = document.createElement('script');
                script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js';
                script.async = true;
                script.innerHTML = JSON.stringify({ symbol, width: "100%", height: "100%", locale: "kr", dateRange: "12M", colorTheme: theme, isTransparent: true, autosize: true, largeChartUrl: "" });
                div.appendChild(script); ref.current.appendChild(div);
            }, [theme, symbol]);
            return <div ref={ref} className="h-full w-full"></div>;
        });

        const TradingViewTicker = memo(({ theme }) => {
            const ref = useRef(null);
            useEffect(() => {
                if(!ref.current) return; ref.current.innerHTML = '';
                const script = document.createElement('script'); script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js'; script.async = true;
                script.innerHTML = JSON.stringify({ symbols: [{proName: "FX_IDC:XAGUSD", title: "은"}, {proName: "FX_IDC:XAUUSD", title: "금"}, {proName: "BINANCE:BTCUSDT", title: "비트코인"}, {proName: "FX_IDC:USDKRW", title: "환율"}], showSymbolLogo: true, colorTheme: theme, isTransparent: true, displayMode: "adaptive", locale: "kr" });
                ref.current.appendChild(script);
            }, [theme]);
            return <div className="tradingview-widget-container w-full h-full" ref={ref}></div>;
        });

        const TradingViewHeatmap = memo(({ theme }) => {
            const ref = useRef(null);
            useEffect(() => {
                if(!ref.current) return; ref.current.innerHTML = '';
                const script = document.createElement('script'); script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js'; script.async = true;
                script.innerHTML = JSON.stringify({ dataSource: "SPX500", grouping: "sector", blockSize: "market_cap_basic", blockColor: "change", locale: "kr", colorTheme: theme, hasTopBar: false, isTransparent: true, width: "100%", height: "100%" });
                ref.current.appendChild(script);
            }, [theme]);
            return <div ref={ref} className="h-full w-full"></div>;
        });

        const BridgeChart = memo(({ data, labels, colors, percents, growthRate, isDark, qty }) => {
            const canvasRef = useRef(null); 
            const chartRef = useRef(null);

            useEffect(() => {
                if (typeof Chart === 'undefined') { console.warn("Chart.js not loaded"); return; }
                if (!canvasRef.current || !data || !Array.isArray(data)) return;
                if (chartRef.current) chartRef.current.destroy();
                const ctx = canvasRef.current.getContext('2d');
                
                const safeData = data.map(d => {
                    if (Array.isArray(d)) return [d[0] || 0, d[1] || 0];
                    return d || 0;
                });
                const lineData = safeData.map((d, i) => {
                    if (i === 0 || i === safeData.length - 1) return d[1];
                    return null;
                });

                try {
                    chartRef.current = new Chart(ctx, {
                        type: 'bar',
                        data: { 
                            labels, 
                            datasets: [
                                { label: '평가금액', data: safeData, backgroundColor: colors, borderRadius: 4, borderSkipped: false, order: 2 },
                                { type: 'line', label: 'Growth Flow', data: lineData, borderColor: isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)', borderDash: [6, 4], pointRadius: 3, pointBackgroundColor: isDark?'#fff':'#333', borderWidth: 1.5, fill: false, spanGaps: true, order: 1 }
                            ] 
                        },
                        options: { 
                            responsive: true, maintainAspectRatio: false, 
                            layout: { padding: { top: 50, left: 15, right: 15, bottom: 20 } },
                            plugins: { 
                                legend: { display: false }, datalabels: { display: false }, 
                                tooltip: { 
                                    callbacks: { 
                                        label: (ctx) => { 
                                            const raw = ctx.raw;
                                            if (!Array.isArray(raw)) return '';
                                            const index = ctx.dataIndex;
                                            const isTotal = index === 0 || index === ctx.chart.data.labels.length - 1;
                                            const start = raw[0], end = raw[1];
                                            const diff = end - start;
                                            const valToDisplayUnit = isTotal ? end : diff;
                                            const totalVal = valToDisplayUnit * (qty || 0);
                                            const manwon = Math.round(totalVal / 10000);
                                            const label = isTotal ? '총 평가액' : '변동 기여분';
                                            const sign = (totalVal > 0 && !isTotal) ? '+' : '';
                                            return `${label}: ${sign}${manwon.toLocaleString()}만원`; 
                                        } 
                                    } 
                                } 
                            }, 
                            scales: { x: { grid: { display: false }, ticks: { color: isDark ? '#aaa' : '#666', font: {size: 11, weight:'bold'} } }, y: { display: false } } 
                        },
                        plugins: [{
                            id: 'customLabels',
                            afterDraw: (chart) => {
                                const { ctx } = chart;
                                const meta = chart.getDatasetMeta(0);
                                if (!meta.data.length) return;
                                
                                meta.data.forEach((bar, index) => {
                                    const value = safeData[index][1];
                                    const isTotal = index === 0 || index === safeData.length - 1;
                                    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                                    const labelY = bar.y - 12;

                                    if (isTotal) {
                                        ctx.font = 'bold 11px Pretendard'; ctx.fillStyle = isDark ? '#fff' : '#1D1D1F';
                                        ctx.fillText(Math.round(value/10000).toLocaleString(), bar.x, labelY);
                                    } else {
                                        if (percents && percents[index] !== null) {
                                            const pct = percents[index] || 0;
                                            const text = (pct > 0 ? '+' : '') + pct.toFixed(1) + '%';
                                            ctx.font = 'bold 11px Pretendard'; ctx.fillStyle = pct >= 0 ? (isDark ? '#FF453A' : '#FF3B30') : '#0071E3';
                                            ctx.fillText(text, bar.x, labelY);
                                        }
                                    }
                                    ctx.restore();
                                });
                                
                                if (growthRate !== undefined && !isNaN(growthRate)) {
                                    const startBar = meta.data[0]; const endBar = meta.data[meta.data.length - 1];
                                    if(startBar && endBar) {
                                        const midX = (startBar.x + endBar.x) / 2; const midY = Math.min(startBar.y, endBar.y) - 30;
                                        const text = (growthRate > 0 ? '+' : '') + growthRate.toFixed(1) + '%';
                                        ctx.save(); ctx.font = 'bold 12px Pretendard';
                                        const textWidth = ctx.measureText(text).width + 16; const textHeight = 24;
                                        ctx.fillStyle = isDark ? '#333' : '#fff'; ctx.shadowColor = 'rgba(0,0,0,0.15)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
                                        ctx.beginPath(); ctx.roundRect(midX - textWidth/2, midY - textHeight/2, textWidth, textHeight, 12); ctx.fill();
                                        ctx.shadowColor = 'transparent'; ctx.strokeStyle = growthRate >= 0 ? '#FF3B30' : '#0071E3'; ctx.lineWidth = 1.5; ctx.stroke();
                                        ctx.fillStyle = growthRate >= 0 ? '#FF3B30' : '#0071E3'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, midX, midY);
                                        ctx.restore();
                                    }
                                }
                            }
                        }]
                    });
                } catch(err) { console.error("Chart failed:", err); }
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, labels, colors, isDark, percents, growthRate, qty]);
            return <div className="w-full h-full"><canvas ref={canvasRef}></canvas></div>;
        });

        const IpoCalendarWidget = memo(({ isDark }) => {

                                                    <div className="space-y-6">
                                                        <div className="grid grid-cols-2 gap-6">
                                                            <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">공모가 (원)</label><input className="apple-input bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 text-center !py-3 !text-base" placeholder="2,000" value={ipoCalcInputs.price} onChange={e=>handleCommaChange(e,v=>setIpoCalcInputs({...ipoCalcInputs,price:v}))} /></div>
                                                            <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">청약 수량 (주)</label><input className="apple-input bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 text-center !py-3 !text-base" placeholder="10" value={ipoCalcInputs.qty} onChange={e=>handleCommaChange(e,v=>setIpoCalcInputs({...ipoCalcInputs,qty:v}))} /></div>
                                                        </div>
                                                        <div className="space-y-2">
                                                            <label className="text-xs font-bold text-gray-500 dark:text-gray-400 block">증거금률 선택</label>
                                                            <div className="flex bg-gray-100 dark:bg-[#2C2C2E] rounded-xl p-1 border border-gray-200 dark:border-white/5">
                                                                <button onClick={()=>setIpoCalcInputs({...ipoCalcInputs, marginRate:50})} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${ipoCalcInputs.marginRate===50?'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm':'text-gray-400 hover:text-gray-600'}`}>50% (일반)</button>
                                                                <button onClick={()=>setIpoCalcInputs({...ipoCalcInputs, marginRate:100})} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${ipoCalcInputs.marginRate===100?'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm':'text-gray-400 hover:text-gray-600'}`}>100% (우대/스팩)</button>
                                                            </div>
                                                        </div>
                                                        <div className="bg-[#F2F4F8] dark:bg-white/5 p-6 rounded-2xl space-y-4">
                                                            <div className="flex justify-between items-center"><span className="text-sm font-bold text-gray-500 dark:text-gray-400">총 청약금액</span><span className="text-xl font-black text-black dark:text-white">{formatNumber(parseFormattedNumber(ipoCalcInputs.price)*parseFormattedNumber(ipoCalcInputs.qty))}원</span></div>
                                                            <div className="h-px bg-gray-200 dark:bg-white/10 w-full my-2"></div>
                                                            <div className="flex justify-between items-center"><span className="text-sm font-bold text-black dark:text-white">필요 증거금</span><span className="text-2xl font-black text-blue-600">{formatNumber(parseFormattedNumber(ipoCalcInputs.price)*parseFormattedNumber(ipoCalcInputs.qty)*(ipoCalcInputs.marginRate/100))}원</span></div>
                                                        </div>
                                                    </div>
                                                </AppleCard>
                                            )}
                                            {activeTool === 'exchange' && (
                                                <AppleCard title="실시간 환율 계산기" subTitle="주요 통화 간편 변환">
                                                    <div className="space-y-6">
                                                        <div className="flex gap-4 items-center justify-center py-4">
                                                            <select className="apple-input !w-32 text-center bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 font-bold !py-3 !text-base rounded-xl" value={exchInputs.base} onChange={e=>setExchInputs({...exchInputs, base:e.target.value})}>{Object.keys(DEFAULT_EXCHANGE_RATES).map(k=><option key={k} value={k}>{k}</option>)}</select>
                                                            <div className="w-10 h-10 rounded-full bg-gray-100 dark:bg-white/10 flex items-center justify-center text-gray-400"><i className="fa-solid fa-arrow-right"></i></div>
                                                            <select className="apple-input !w-32 text-center bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 font-bold !py-3 !text-base rounded-xl" value={exchInputs.target} onChange={e=>setExchInputs({...exchInputs, target:e.target.value})}>{Object.keys(DEFAULT_EXCHANGE_RATES).map(k=><option key={k} value={k}>{k}</option>)}</select>
                                                        </div>
                                                        <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">금액 ({exchInputs.base})</label><input className="apple-input !text-2xl !py-4 bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 font-bold text-center" value={exchInputs.amount} onChange={e=>handleCommaChange(e, v=>setExchInputs({...exchInputs, amount:v}))} /></div>
                                                        <div className="bg-[#F2F4F8] dark:bg-white/5 p-8 rounded-3xl text-center space-y-2">
                                                            <span className="text-sm font-bold text-gray-500 dark:text-gray-400 block mb-2">환산 금액 ({exchInputs.target})</span>
                                                            <span className="text-4xl font-black text-black dark:text-white block">{formatNumber(parseFormattedNumber(exchInputs.amount) * (DEFAULT_EXCHANGE_RATES[exchInputs.base].krw) / (DEFAULT_EXCHANGE_RATES[exchInputs.target].krw))}</span>
                                                            <span className="text-xs font-bold text-gray-400 block mt-4">적용 환율: 1 {exchInputs.base} = {formatNumber((DEFAULT_EXCHANGE_RATES[exchInputs.base].krw) / (DEFAULT_EXCHANGE_RATES[exchInputs.target].krw))} {exchInputs.target}</span>
                                                        </div>
                                                    </div>
                                                </AppleCard>
                                            )}
                                            {activeTool === 'average' && (
                                                <AppleCard title="평단가 계산기" subTitle="물타기 시뮬레이션">
                                                    <div className="space-y-4">
                                                        <div className="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                                            {avgRows.map((r,i)=>(
                                                                <div key={r.id} className="flex gap-3 items-center bg-gray-50 dark:bg-white/5 p-3 rounded-xl border border-transparent hover:border-gray-200 dark:hover:border-white/10 transition-colors">
                                                                    <div className="w-6 h-6 rounded-full bg-white dark:bg-white/10 flex items-center justify-center text-xs font-bold text-gray-400 shadow-sm">{i+1}</div>
                                                                    <div className="flex-1 grid grid-cols-2 gap-3"><div><label className="text-[10px] text-gray-400 block mb-1 ml-1">수량</label><input className="apple-input !py-2 text-sm bg-white dark:bg-black/20" placeholder="수량" value={r.q} onChange={e=>{const n=[...avgRows]; n[i].q=e.target.value; setAvgRows(n)}} /></div><div><label className="text-[10px] text-gray-400 block mb-1 ml-1">단가</label><input className="apple-input !py-2 text-sm bg-white dark:bg-black/20" placeholder="단가" value={r.p} onChange={e=>{const n=[...avgRows]; n[i].p=e.target.value; setAvgRows(n)}} /></div></div>
                                                                    {avgRows.length > 1 && (<button onClick={()=>{const n=avgRows.filter(row=>row.id!==r.id); setAvgRows(n)}} className="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-red-500 transition"><i className="fa-solid fa-trash text-sm"></i></button>)}
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <button onClick={()=>setAvgRows([...avgRows,{id:Date.now(),q:'',p:''}])} className="w-full py-3 bg-gray-100 dark:bg-white/10 rounded-xl text-sm font-bold text-gray-500 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-white/20 transition flex items-center justify-center gap-2"><i className="fa-solid fa-plus"></i> 추가하기</button>
                                                        <div className="bg-[#F2F4F8] dark:bg-white/5 p-6 rounded-2xl mt-4">
                                                            <div className="flex justify-between items-end border-b border-gray-200 dark:border-white/10 pb-4 mb-4"><span className="text-sm font-bold text-gray-500 dark:text-gray-400">총 보유 수량</span><span className="text-lg font-bold text-black dark:text-white">{formatNumber(avgResult.totalQ)}주</span></div>
                                                            <div className="flex justify-between items-end"><span className="text-sm font-bold text-gray-500 dark:text-gray-400">평균 단가</span><span className="text-3xl font-black text-blue-600">{formatNumber(avgResult.avg)}원</span></div>
                                                            <div className="mt-2 text-right"><span className="text-xs font-bold text-gray-400">총 매수금액: {formatNumber(avgResult.totalAmt)}원</span></div>
                                                        </div>
                                                    </div>
                                                </AppleCard>
                                            )}
                                            {activeTool === 'unit' && (
                                                <AppleCard title="단위 변환기" subTitle="귀금속 중량 변환">
                                                    <div className="space-y-6">
                                                        <div className="flex bg-gray-100 dark:bg-[#2C2C2E] p-1 rounded-xl border border-gray-200 dark:border-white/5">
                                                            <button onClick={()=>setUnitConv({...unitConv,base:'don'})} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${unitConv.base==='don'?'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm':'text-gray-400'}`}>돈 (don)</button>
                                                            <button onClick={()=>setUnitConv({...unitConv,base:'gram'})} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${unitConv.base==='gram'?'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm':'text-gray-400'}`}>그램 (g)</button>
                                                            <button onClick={()=>setUnitConv({...unitConv,base:'oz'})} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${unitConv.base==='oz'?'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm':'text-gray-400'}`}>온스 (oz)</button>
                                                        </div>
                                                        <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">입력 값 ({unitConv.base})</label><input className="apple-input !text-3xl !py-6 bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 font-bold text-center" value={unitConv.value} onChange={e=>setUnitConv({...unitConv,value:e.target.value})} placeholder="0" /></div>
                                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                            {['don','gram','oz','kg'].filter(u=>u!==unitConv.base).map(u=>(
                                                                <div key={u} className="bg-[#F2F4F8] dark:bg-white/5 p-4 rounded-2xl flex flex-col items-center justify-center">
                                                                    <span className="text-xs font-bold text-gray-400 mb-1 uppercase">{u}</span>
                                                                    <span className="text-xl font-bold text-slate-800 dark:text-white">
                                                                        {(()=>{
                                                                            let v=parseFloat(unitConv.value)||0; 
                                                                            if(unitConv.base==='don'){ if(u==='gram')v*=3.75; else if(u==='oz')v*=0.1205; else v*=0.00375; } else if(unitConv.base==='gram'){ if(u==='don')v/=3.75; else if(u==='oz')v/=31.1035; else v/=1000; } else { if(u==='gram')v*=31.1035; else if(u==='don')v*=8.294; else v*=0.0311; } 
                                                                            return v.toLocaleString(undefined,{maximumFractionDigits:4});
                                                                        })()}
                                                                    </span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </AppleCard>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                            {activeTab === 'simulation' && (
                                <div className="flex flex-col items-center justify-center h-[500px] text-center space-y-4">
                                    <div className="w-20 h-20 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center"><i className="fa-solid fa-person-digging text-4xl text-gray-400"></i></div>
                                    <div><h3 className="text-xl font-bold text-slate-800 dark:text-white">페이지 작성 중</h3><p className="text-sm text-gray-500 mt-2">시뮬레이션 기능은 더욱 강력하게 돌아올 예정입니다.</p></div>
                                </div>
                            )}
                        </main>
                        {expandedView && (
                            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur flex items-center justify-center p-4">
                                <div className="bg-white dark:bg-[#1C1C1E] w-full max-w-6xl h-[85vh] rounded-2xl flex flex-col overflow-hidden">
                                    <div className="p-3 border-b dark:border-white/10 flex justify-between items-center"><h3 className="font-bold dark:text-white">상세 보기</h3><button onClick={()=>setExpandedView(null)}><i className="fa-solid fa-xmark text-lg dark:text-white"></i></button></div>
                                    <div className="flex-1 p-4 bg-gray-100 dark:bg-black">{expandedView === 'heatmap' && <TradingViewHeatmap theme={isDark?'dark':'light'} />}</div>
                                </div>
                            </div>
                        )}
                        {isInputModalOpen && renderInputModal()}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
