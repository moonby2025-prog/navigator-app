        /* --- Base & Reset --- */

        /* --- Apple UI System Styles --- */
        /* Card */
        .apple-card { 
            background-color: #ffffff; 
            border-radius: 20px; 
            padding: 24px; 
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04); 
            border: 1px solid rgba(0,0,0,0.04); 
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);

        .dark .apple-card {

            border: 1px solid rgba(255,255,255,0.08); 
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25); 
        }
        
        /* Inputs */
        .apple-input { 
            width: 100%; 
            background-color: #F2F2F7; 
            border: none; 
            border-radius: 10px; 
            padding: 12px 14px; 
            font-size: 15px; 
            font-weight: 600; 
            color: #1D1D1F; 
            text-align: right; 
            outline: none; 
            transition: all 0.2s; 
        }
        .dark .apple-input { 
            background-color: #2C2C2E; 
            color: #FFFFFF; 
        }
        .apple-input:focus { 
            box-shadow: 0 0 0 2px #0071E3; 
            background-color: #FFFFFF; 
        }
        .dark .apple-input:focus { 
            background-color: #3A3A3C; 
        }

        /* Stats & Labels */
        .apple-stat-label { 
            font-size: 13px; 
            font-weight: 600; 
            color: #86868B; 
            margin-bottom: 4px; 
        }
        .dark .apple-stat-label { color: #9ca3af; }
        
        .apple-stat-value { 
            font-size: 24px; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
        }
        
        /* Navigation Tabs (Segmented Control Style) */
        .nav-tab {
            font-weight: 600;
            color: #86868B;
        }
        .dark .nav-tab { color: #98989D; }
        
        .nav-tab.active { 
            background-color: #FFFFFF; 
            color: #000000; 
            font-weight: 700; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.12); 
        }
        .dark .nav-tab.active { 
            background-color: #636366; 
            color: #FFFFFF; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Utilities */
        .nav-container { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .nav-container::-webkit-scrollbar { display: none; }
        .ticker-fallback { display: flex; white-space: nowrap; overflow: hidden; align-items: center; height: 100%; width: 100%; }
        .num-font { font-variant-numeric: tabular-nums; }

        // --- Tax Calculation Helper ---
        const calculateGlobalTax = (finIncome, otherIncome) => {
            if (finIncome <= 20000000) {
                return { type: 'separation', finTax: finIncome * 0.154, globalTax: 0, total: finIncome * 0.154, msg: "분리과세 종결 (2,000만원 이하)" };
            } else {
                const excessFinIncome = finIncome - 20000000;
                const taxBase = excessFinIncome + otherIncome;
                let baseTax = 0;
                if (taxBase <= 14000000) baseTax = taxBase * 0.06;
                else if (taxBase <= 50000000) baseTax = 840000 + (taxBase - 14000000) * 0.15;
                else if (taxBase <= 88000000) baseTax = 6240000 + (taxBase - 50000000) * 0.24;
                else if (taxBase <= 150000000) baseTax = 15360000 + (taxBase - 88000000) * 0.35;
                else if (taxBase <= 300000000) baseTax = 37060000 + (taxBase - 150000000) * 0.38;
                else if (taxBase <= 500000000) baseTax = 94060000 + (taxBase - 300000000) * 0.40;
                else if (taxBase <= 1000000000) baseTax = 174060000 + (taxBase - 500000000) * 0.42;
                else baseTax = 384060000 + (taxBase - 1000000000) * 0.45;
                const calcTax = (20000000 * 0.14) + baseTax;
                const localTax = calcTax * 0.1;
                return { type: 'global', finTax: 0, globalTax: calcTax + localTax, total: calcTax + localTax, msg: "종합과세 대상 (2,000만원 초과)" };
            }
        };

        const calculateProgressiveIncomeTax = (income, rates) => {
            if (income <= 0) return 0;
            const threshold1 = 40000000;
            const threshold2 = 80000000;
            let tax = 0;
            const income1 = Math.min(income, threshold1);
            tax += income1 * (rates.rate1 / 100);
            if (income > threshold1) {
                const income2 = Math.min(income, threshold2) - threshold1;
                tax += income2 * (rates.rate2 / 100);
            }
            if (income > threshold2) {
                const income3 = income - threshold2;
                tax += income3 * (rates.rate3 / 100);
            }
            return Math.max(0, tax);
        };

                                        // Waterfall logic: 프리미엄은 (현재가 - 이론가)이므로, 이론가 막대에서 현재가 막대까지를 연결해야 함.
                                        // 하지만 여기서는 요인별 누적을 보여주므로:

                                        // 2. +국제시세변동
                                        // 3. +환율변동

                                        const actual = silverProfitData.actualPrice / 10000;
                                        
                                        // 4단계 프리미엄 값 역산 (Floating point 오차 보정용)
                                        const calcTheoretical = baseUnit + pContrib + eContrib;
                                        const residualPremium = actual - calcTheoretical;

                                        chartData = [
                                            [0, Math.round(baseUnit)], 
                                            [Math.round(baseUnit), Math.round(baseUnit + pContrib)], 
                                            [Math.round(baseUnit + pContrib), Math.round(baseUnit + pContrib + eContrib)],

                                        percentData = [
                                            null, // 매입가는 금액 표시

                                            (silverProfitData.exchContrib / base) * 100,  // 수익 기여도

                                        ];

                                        secondarySummaryData = [
                                            {label:'총 평가금액', value:formatManwon(silverProfitData.totalValuation), color:'text-slate-900 dark:text-white'},

                                        ];
                                    } else {
                                        // Bitcoin Logic
                                        const base = bitcoinProfitData.avgPrice;
                                        const baseUnit = base / 10000;
                                        
                                        // [수정] 수량이 0이거나 없을 경우, 차트 시각화를 위해 1 BTC를 기준으로 설정
                                        const vizQty = bitcoinProfitData.qty > 0 ? bitcoinProfitData.qty : 1;

                                        const pContrib = (bitcoinProfitData.priceContrib * vizQty) / 10000;
                                        const eContrib = (bitcoinProfitData.exchContrib * vizQty) / 10000;
                                        const actual = (bitcoinProfitData.actualPrice * vizQty) / 10000;
                                        
                                        // 차트용 이론가 역산
                                        const calcTheoretical = (baseUnit * vizQty) + pContrib + eContrib;
                                        
                                        chartData = [
                                            [0, Math.round(baseUnit * vizQty)], // 총 매수액 (또는 1BTC 기준가)
                                            [Math.round(baseUnit * vizQty), Math.round((baseUnit * vizQty) + pContrib)], 
                                            [Math.round((baseUnit * vizQty) + pContrib), Math.round((baseUnit * vizQty) + pContrib + eContrib)], 
                                            [Math.round((baseUnit * vizQty) + pContrib + eContrib), Math.round(actual)], 
                                            [0, Math.round(actual)]
                                        ];
                                        
                                        // 라벨: 수량이 없으면 '1BTC 기준'으로 표시 변경
                                        const isSimulated = bitcoinProfitData.qty <= 0;
                                        labels = [
                                            isSimulated ? '매입가(1BTC)' : '총매수', 
                                            '시세변동', 
                                            '환율효과', 
                                            '김치프리미엄', 
                                            isSimulated ? '현재가(1BTC)' : '총평가'
                                        ];
                                        colors = ['#D1D1D6', '#FF3B30', '#0071E3', '#FF9F0A', bitcoinProfitData.totalProfit >= 0 ? '#FF3B30' : '#0071E3'];
                                        
                                        // 퍼센트 데이터 수정

                                        const safeTotalBuy = totalBuy === 0 ? 1 : totalBuy; // 0으로 나누기 방지

                                        percentData = [
                                            null,
                                            ((bitcoinProfitData.priceContrib * vizQty) / safeTotalBuy) * 100,
                                            ((bitcoinProfitData.exchContrib * vizQty) / safeTotalBuy) * 100,
                                            bitcoinProfitData.kPremiumPercent, // KP는 그대로
                                            null
                                        ];

                                        const premTotal = bitcoinProfitData.kPremium * vizQty;
                                        summaryData = [
                                            {label:'시세차익',value:formatManwon(bitcoinProfitData.priceContrib * vizQty),color:bitcoinProfitData.priceContrib>=0?'text-red-500':'text-blue-500'}, 
                                            {label:'환차익',value:formatManwon(bitcoinProfitData.exchContrib * vizQty),color:bitcoinProfitData.exchContrib>=0?'text-red-500':'text-blue-500'}, 
                                            {label:'프리미엄 잔존',value:(premTotal>=0?'+':'')+formatManwon(premTotal),color:'text-amber-500'}
                                        ];

                                        // 하단 상세 요약은 실제 수량(0)을 반영
                                        secondarySummaryData = [
                                            {label:'총 평가금액', value:formatManwon(bitcoinProfitData.totalValuation), color:'text-slate-900 dark:text-white'},
                                            {label:'총 평가손익', value:(bitcoinProfitData.totalProfit>=0?'+':'')+formatManwon(bitcoinProfitData.totalProfit), color:bitcoinProfitData.totalProfit>=0?'text-red-500':'text-blue-500'}
                                        ];
                                    }

                                    return (
                                        <BridgeChart

                                            labels={labels}
                                            colors={colors}
                                            summaryData={summaryData}
                                            isDark={isDark}
                                            growthRate={analysisMode === 'silver' ? silverProfitData.actualRate : bitcoinProfitData.profitRate}
                                            percentData={percentData}
                                            secondarySummaryData={secondarySummaryData}
                                        />
                                    );
                                })()}

                    const isTarget = find > TAX_THRESHOLD; 
                    const findTaxable = isTarget ? (find - TAX_THRESHOLD) : 0; 
                    const combinedBase = earned + findTaxable;
                    
                    let rem = combinedBase; 
                    let calculatedTax = 0; 
                    let lastLimit = 0; 
                    const breakdown = [];
                    
                    for (const b of brackets) { 
                        if (rem <= 0) break; 
                        const chunk = Math.min(rem, b.limit - lastLimit); 
                        const tax = chunk * b.rate; 
                        breakdown.push({ label: `${formatNumber(lastLimit/10000)}만~${isFinite(b.limit) ? formatNumber(b.limit/10000)+'만' : '초과'}`, income: chunk, rate: b.rate * 100, tax: tax });

                        rem -= chunk; 
                        lastLimit = b.limit;

                        taxEOnly += chunk * b.rate; 
                        remE -= chunk;

                    const additionalPayable = totalDecided - (prepaidEarned + prepaidFin);

                    return { totalDecided, additionalPayable, nhiAnnual, isTarget, breakdown, totalPrepaid: prepaidEarned + prepaidFin };
                };

                                    {/* Main Result Hero */}
                                    <div className="bg-[#1C1C1E] dark:bg-black p-6 rounded-3xl text-center shadow-lg relative overflow-hidden mb-6 group">
                                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
                                        <p className="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">최종 실질 추가 부담액 (세금 + 건보료)</p>
                                        <h4 className="text-4xl sm:text-5xl font-black text-white mb-2 tracking-tighter group-hover:scale-105 transition-transform">{formatNumber(finalTotalBurden)}원</h4>
                                        <p className="text-[10px] text-gray-500 font-medium mb-4">* 기납부 세액(15.4% 등)을 제외한 순수 추가 납부액</p>
                                        
                                        <div className="flex justify-center gap-2">
                                            <div className="bg-white/10 px-3 py-1.5 rounded-lg backdrop-blur-md">
                                                <span className="text-[10px] text-gray-300 block">종합소득세</span>
                                                <span className="text-sm font-bold text-white">{formatNumber(resCurrent.additionalPayable)}원</span>
                                            </div>
                                            <div className="bg-white/10 px-3 py-1.5 rounded-lg backdrop-blur-md">
                                                <span className="text-[10px] text-gray-300 block">지역 건보료(연)</span>
                                                <span className="text-sm font-bold text-white">{formatNumber(resCurrent.nhiAnnual)}원</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Comparison & Impact */}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                                        <div className="p-4 rounded-2xl bg-[#F2F2F7] dark:bg-[#2C2C2E] border border-transparent dark:border-white/5">
                                            <div className="text-[10px] font-bold text-slate-400 mb-1">분리과세 종결 시 (가정)</div>
                                            <div className="text-lg font-black text-slate-600 dark:text-slate-300">{formatNumber(resNoEarned.additionalPayable)}원</div>
                                            <div className="text-[10px] text-slate-400 mt-1">금융소득만 있을 경우</div>
                                        </div>
                                        <div className="p-4 rounded-2xl bg-rose-50 dark:bg-rose-900/10 border border-rose-100 dark:border-rose-900/30">
                                            <div className="text-[10px] font-bold text-rose-400 mb-1">합산과세로 인한 증가분</div>
                                            <div className="text-lg font-black text-rose-600 dark:text-rose-400">+{formatNumber(taxImpact)}원</div>
                                            <div className="text-[10px] text-rose-400/70 mt-1">근로소득 합산 효과</div>
                                        </div>
                                    </div>

                                    {/* Detailed Table */}
                                    <div>
                                        <h4 className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-3 px-1">과세 구간별 산출 내역</h4>
                                        <div className="overflow-hidden rounded-xl border border-slate-200 dark:border-slate-700">
                                            <table className="w-full text-[11px] text-left">
                                                <thead className="bg-slate-50 dark:bg-slate-800">
                                                    <tr className="text-slate-500 dark:text-slate-400">
                                                        <th className="py-2.5 px-3 font-bold">과세 구간</th>
                                                        <th className="py-2.5 px-3 text-right font-bold">해당 소득</th>
                                                        <th className="py-2.5 px-3 text-center font-bold">세율</th>
                                                        <th className="py-2.5 px-3 text-right font-bold">산출 세액</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-slate-700 bg-white dark:bg-[#1C1C1E]">
                                                    {resCurrent.breakdown.map((b, idx) => (
                                                        <tr key={idx} className="hover:bg-slate-50 dark:hover:bg-white/5 transition">
                                                            <td className="py-2.5 px-3 font-medium text-slate-700 dark:text-slate-300">{b.label}</td>
                                                            <td className="py-2.5 px-3 text-right font-bold text-slate-700 dark:text-slate-200">{formatNumber(b.income)}</td>
                                                            <td className="py-2.5 px-3 text-center font-bold text-indigo-500">{b.rate}%</td>
                                                            <td className="py-2.5 px-3 text-right font-bold text-slate-600 dark:text-slate-400">{formatNumber(b.tax)}</td>
                                                        </tr>
                                                    ))}
                                                    <tr className="bg-indigo-50/50 dark:bg-indigo-900/10 font-bold">
                                                        <td className="py-3 px-3 text-indigo-900 dark:text-indigo-200" colSpan="3">누진세액 합계</td>
                                                        <td className="py-3 px-3 text-right text-indigo-600 dark:text-indigo-400">{formatNumber(resCurrent.breakdown.reduce((a,c)=>a+c.tax, 0))}원</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </AppleCard>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className={`min-h-screen flex flex-col transition-colors duration-200 ${isDark ? 'dark bg-black text-white' : 'bg-[#F5F5F7] text-slate-800'}`}>
                    <header className="sticky top-0 z-50 bg-white/80 dark:bg-[#1C1C1E]/80 backdrop-blur-xl border-b dark:border-white/10 shadow-sm h-16">
                        <div className="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
                            <div className="flex items-center gap-2 font-black text-xl flex-shrink-0 tracking-tighter"><i className="fa-solid fa-layer-group text-[#0071E3]"></i> <span className="hidden sm:inline text-black dark:text-white">INVESTMENT NAVIGATOR</span></div>
                            <div className="nav-container flex-1 mx-4"><nav className="inline-flex bg-[#F2F2F7] dark:bg-[#2C2C2E] p-1 rounded-full gap-1">{[{id:'dashboard',l:'대시보드'},{id:'routine',l:'루틴'},{id:'tools',l:'도구'},{id:'simulation',l:'노후자금'},{id:'tax',l:'금융과세'}].map(t => (<button key={t.id} onClick={()=>setActiveTab(t.id)} className={`nav-tab px-4 py-1.5 text-xs rounded-full transition-all duration-300 ${activeTab === t.id ? 'active' : 'hover:text-black dark:hover:text-white'}`}>{t.l}</button>))}</nav></div>
                            <button onClick={()=>setIsDark(!isDark)} className="w-9 h-9 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] hover:bg-gray-200 dark:hover:bg-gray-700 transition flex items-center justify-center flex-shrink-0"><i className={`fa-solid ${isDark?'fa-sun text-yellow-400':'fa-moon text-[#0071E3]'}`}></i></button>
                        </div>
                    </header>
                    <main className="max-w-7xl w-full mx-auto px-4 py-8 flex-1 overflow-x-hidden">{activeTab === 'dashboard' && renderDashboard()}{activeTab === 'routine' && renderRoutine()}{activeTab === 'tools' && renderTools()}{activeTab === 'simulation' && renderSimulation()}{activeTab === 'tax' && renderFinancialTax()}</main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
