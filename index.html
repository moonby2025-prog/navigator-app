            if (num === null || num === undefined || isNaN(num)) return '0';

        const calculateProgressiveIncomeTax = (income, rates) => {
            if (income <= 0) return 0;
            const threshold1 = 40000000;
            const threshold2 = 80000000;
            let tax = 0;
            const income1 = Math.min(income, threshold1);
            tax += income1 * (rates.rate1 / 100);
            if (income > threshold1) {
                const income2 = Math.min(income, threshold2) - threshold1;
                tax += income2 * (rates.rate2 / 100);
            }
            if (income > threshold2) {
                const income3 = income - threshold2;
                tax += income3 * (rates.rate3 / 100);
            }
            return Math.max(0, tax);
        };

                const targetLegacyValue = parseFormattedNumber(s.targetLegacy);

                const initLiving = parseFormattedNumber(s.monthlyLiving) * 12;
                
                const userPenInfo = getAdjustedPensionAmount(parseFormattedNumber(s.pensionSelf), s.pensionStrategyUser);

                const initOtherTotal = parseFormattedNumber(s.ipoProfit) + parseFormattedNumber(s.otherIncome) + parseFormattedNumber(s.stockLending) + parseFormattedNumber(s.rentalIncome);
                
                let history = []; 
                let totalTaxAccum = 0; 
                let depletionYear = null;
                const period = Math.max(1, 96 - s.simulationStartAge);
                
                for (let year = 1; year <= period; year++) {
                    const age = s.simulationStartAge + year - 1;
                    const spouseAge = age - ageDiff;
                    
                    const pInf = Math.pow(1 + (s.inflationRate / 100), year - 1);
                    const lInf = Math.pow(1 + (s.livingCostInflationRate / 100), year - 1);
                    
                    const startTotalAssets = cUserNon + cSpouseNon + cUserISA + cSpouseISA + cIPO;

                    const grossUserNon = cUserNon * (s.returnUserNonISA / 100);
                    const grossSpouseNon = cSpouseNon * (s.returnSpouseNonISA / 100);
                    const ipoCmaProfit = cIPO * (s.returnCMA / 100); 
                    const ipoCapitalProfit = cIPO * (s.returnIPO / 100); 
                    const grossUserISA = cUserISA * (s.returnUserISA / 100);
                    const grossSpouseISA = cSpouseISA * (s.returnSpouseISA / 100);

                    const taxableProfitYear = grossUserNon + grossSpouseNon + ipoCmaProfit;
                    const exemptProfitYear = ipoCapitalProfit + grossUserISA + grossSpouseISA;

                    const netProfUserNon = grossUserNon * 0.846;
                    const netProfSpouseNon = grossSpouseNon * 0.846;
                    const netProfUserISA = grossUserISA * 0.901; 
                    const netProfSpouseISA = grossSpouseISA * 0.901;
                    const netProfIPO = (ipoCmaProfit * 0.846) + ipoCapitalProfit; 
                    
                    const totalNetInvestmentProfit = netProfUserNon + netProfSpouseNon + netProfUserISA + netProfSpouseISA + netProfIPO;

                    let weight = 1.0; 
                    let lateLifeMedicalAnnual = 0;
                    if (age >= Math.min(userPenInfo.startAge, spousePenInfo.startAge)) {
                        if (age < s.highCostStartAge - 5) weight = 1.1; 
                        else if (age < s.highCostStartAge) weight = 0.9; 
                        else { weight = 0.7; lateLifeMedicalAnnual = medicalCostMonthly * 12 * lInf; }
                    }
                    const annualLivingCost = (initLiving * lInf * weight) + lateLifeMedicalAnnual + extraReserveValue;
                    
                    let pension = 0;
                    if (age >= userPenInfo.startAge) pension += userPenInfo.monthlyAmount * 12; 
                    if (spouseAge >= spousePenInfo.startAge) pension += spousePenInfo.monthlyAmount * 12;
                    
                    const annualPension = pension * pInf;
                    const annualOthers = initOtherTotal * pInf;
                    const annualBaseIncome = annualPension + annualOthers;

                    const incTax = calculateProgressiveIncomeTax(annualBaseIncome, { rate1: s.taxRate1, rate2: s.taxRate2, rate3: s.taxRate3 });
                    totalTaxAccum += incTax;
                    const annualTotalExpenses = annualLivingCost + incTax;

                    cUserNon += netProfUserNon;
                    cSpouseNon += netProfSpouseNon;
                    cUserISA += netProfUserISA;
                    cSpouseISA += netProfSpouseISA;
                    cIPO += netProfIPO;

                    const cashSurplus = annualBaseIncome - annualTotalExpenses;

                    if (cashSurplus < 0) {
                        let rem = Math.abs(cashSurplus);
                        let w1 = Math.min(rem, cIPO); cIPO -= w1; rem -= w1;
                        let w2 = Math.min(rem, cSpouseNon); cSpouseNon -= w2; rem -= w2;
                        let w3 = Math.min(rem, cUserNon); cUserNon -= w3; rem -= w3;
                        let w4 = Math.min(rem, cSpouseISA); cSpouseISA -= w4; rem -= w4;
                        let w5 = Math.min(rem, cUserISA); cUserISA -= w5; rem -= w5;
                        if (rem > 0 && !depletionYear) depletionYear = age;
                    } else {
                        cUserNon += cashSurplus;
                    }

                    const currentTotalAssets = cUserNon + cSpouseNon + cUserISA + cSpouseISA + cIPO;
                    const annualNetChange = currentTotalAssets - startTotalAssets;

                    history.push({ 
                        age, 
                        total: Math.max(0, currentTotalAssets / ONE_HUNDRED_MILLION), 
                        tax: incTax, 
                        living: annualLivingCost, 
                        profInvestment: totalNetInvestmentProfit,

                    const isTarget = find > TAX_THRESHOLD; const findTaxable = isTarget ? (find - TAX_THRESHOLD) : 0; const combinedBase = earned + findTaxable;

                                                            <span className="bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-400 px-2 py-0.5 rounded text-[10px] font-black">인출</span>
                                                        )}
                                                    </td>
                                                )}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className={`min-h-screen flex flex-col transition-colors duration-200 ${isDark ? 'dark bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-800'}`}>
                    <header className="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b dark:border-slate-800 shadow-sm h-16">
                        <div className="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
                            <div className="flex items-center gap-2 font-black text-xl flex-shrink-0 tracking-tighter"><i className="fa-solid fa-layer-group text-blue-600"></i> <span className="hidden sm:inline text-black dark:text-white">INVESTMENT NAVIGATOR</span></div>
                            <div className="nav-container flex-1 mx-4">
                                <nav className="inline-flex bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl gap-1">
                                    {[{id:'dashboard',l:'대시보드'},{id:'routine',l:'루틴'},{id:'tools',l:'도구'},{id:'simulation',l:'노후자금'},{id:'tax',l:'금융과세'}].map(t => (
                                        <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`nav-tab px-3 sm:px-6 py-2 text-xs rounded-xl transition-all ${activeTab === t.id ? 'active' : 'text-slate-500 dark:text-slate-400 font-black hover:text-indigo-500'}`}>{t.l}</button>
                                    ))}
                                </nav>
                            </div>
                            <button onClick={()=>setIsDark(!isDark)} className="p-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition flex-shrink-0"><i className={`fa-solid ${isDark?'fa-sun text-amber-400':'fa-moon text-indigo-600 dark:text-white'}`}></i></button>
                        </div>
                    </header>
                    <main className="max-w-7xl w-full mx-auto px-4 py-8 flex-1 overflow-x-hidden">
                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'routine' && renderRoutine()}
                        {activeTab === 'tools' && renderTools()}
                        {activeTab === 'simulation' && renderSimulation()}
                        {activeTab === 'tax' && renderFinancialTax()}
                    </main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
