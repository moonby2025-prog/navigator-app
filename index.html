        const calculateProgressiveIncomeTax = (income, rates) => {
            if (income <= 0) return 0;
            const threshold1 = 40000000;
            const threshold2 = 80000000;
            let tax = 0;
            const income1 = Math.min(income, threshold1);
            tax += income1 * (rates.rate1 / 100);
            if (income > threshold1) {
                const income2 = Math.min(income, threshold2) - threshold1;
                tax += income2 * (rates.rate2 / 100);
            }
            if (income > threshold2) {
                const income3 = income - threshold2;
                tax += income3 * (rates.rate3 / 100);
            }
            return Math.max(0, tax);

        const SilverPerformanceBridgeChart = memo(({ profitData, isDark }) => {
            const canvasRef = useRef(null);

                if (!canvasRef.current || !profitData) return;
                const ctx = canvasRef.current.getContext('2d');
                if (chartInstance.current) chartInstance.current.destroy();
                const MAN_WON = 10000;
                // Values in 'Man Won'
                const buyPriceMan = Math.round(FIXED_BUY_PRICE_KG / MAN_WON);
                const currentPriceMan = Math.round(profitData.actualPrice / MAN_WON);
                // Effects (Calculated in Man Won)
                const priceEffect = Math.round(profitData.priceContrib / MAN_WON);
                const exchEffect = Math.round(profitData.exchContrib / MAN_WON);
                // Residual captures Premium + Interaction
                const premiumEffect = currentPriceMan - (buyPriceMan + priceEffect + exchEffect);
                // Waterfall Data Construction (Floating Bars)
                const bar1 = [0, buyPriceMan]; // Base
                const bar2 = [buyPriceMan, buyPriceMan + priceEffect]; // Price Effect
                const step2End = buyPriceMan + priceEffect;
                const bar3 = [step2End, step2End + exchEffect]; // Exch Effect
                const step3End = step2End + exchEffect;
                const bar4 = [step3End, currentPriceMan]; // Premium/Residual
                const bar5 = [0, currentPriceMan]; // Final
                const upColor = '#FF3B30'; // Red
                const downColor = '#0071E3'; // Blue
                const baseColor = isDark ? '#48484A' : '#D1D1D6';
                const finalColor = profitData.totalProfit >= 0 ? upColor : downColor;
                const getColor = (val) => val >= 0 ? upColor : downColor;
                
                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['매입가', '국제시세', '환율효과', '프리미엄', '현재가'],
                        datasets: [{
                            label: '가격 변동',
                            data: [ bar1, bar2, bar3, bar4, bar5 ],
                            backgroundColor: [ baseColor, getColor(priceEffect), getColor(exchEffect), getColor(premiumEffect), finalColor ],
                            borderRadius: 4,
                            borderSkipped: false
                        }]
                    },
                    options: {
                        layout: { padding: { top: 30 } },
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const raw = context.raw;
                                        const val = raw[1] - raw[0];
                                        if(context.dataIndex === 0 || context.dataIndex === 4) return `금액: ${raw[1].toLocaleString()}만원`;
                                        return `변동: ${val > 0 ? '+' : ''}${val.toLocaleString()}만원`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { grid: { display: false }, ticks: { font: { size: 11, weight: 'bold' }, color: isDark ? '#aaa' : '#555' } },
                            y: { display: false, min: Math.min(buyPriceMan, currentPriceMan) * 0.5 }
                        }
                    },
                    plugins: [
                        {
                            id: 'customLabels',
                            afterDraw(chart) {
                                const { ctx, scales: { x, y } } = chart;
                                
                                // 1. Draw existing bar labels
                                chart.data.datasets[0].data.forEach((datapoint, index) => {
                                    const value = datapoint[1] - datapoint[0];
                                    const isTotal = index === 0 || index === 4;
                                    const meta = chart.getDatasetMeta(0);
                                    const bar = meta.data[index];
                                    if (bar) {
                                        ctx.save();
                                        ctx.textAlign = 'center';
                                        ctx.textBaseline = 'bottom';
                                        ctx.font = isTotal ? 'bold 12px Pretendard' : '11px Pretendard';
                                        ctx.fillStyle = isDark ? '#fff' : '#000';
                                        
                                        let label;
                                        if (isTotal) {
                                            // 매입가, 현재가는 금액 표시
                                            label = `${datapoint[1].toLocaleString()}`;
                                        } else {
                                            // 변경됨: 시장 지표 자체의 변동률 표시
                                            if (index === 1) { // 국제시세 (USD 변화율)
                                                const val = profitData.priceChangeRate;
                                                label = `${val >= 0 ? '▲' : '▼'}${Math.abs(val).toFixed(1)}%`;
                                            } else if (index === 2) { // 환율 (KRW 변화율)
                                                const val = profitData.exchChangeRate;
                                                label = `${val >= 0 ? '▲' : '▼'}${Math.abs(val).toFixed(1)}%`;
                                            } else if (index === 3) { // 프리미엄 (현재 KP%)
                                                const val = profitData.kPremiumPercent;
                                                label = `KP ${val.toFixed(1)}%`;
                                            } else {
                                                // Fallback
                                                const basePrice = chart.data.datasets[0].data[0][1];
                                                const pct = basePrice !== 0 ? (value / basePrice) * 100 : 0;
                                                label = `${pct > 0 ? '+' : ''}${pct.toFixed(1)}%`;
                                            }
                                        }

                                        const yPos = y.getPixelForValue(Math.max(datapoint[0], datapoint[1])) - 5;
                                        ctx.fillText(label, bar.x, yPos);
                                        ctx.restore();
                                    }
                                });

                                // 2. Draw Trend Line (Start Top -> End Top)
                                const meta = chart.getDatasetMeta(0);
                                const startBar = meta.data[0];
                                const endBar = meta.data[4];
                                if (startBar && endBar) {
                                    const startX = startBar.x;
                                    const startY = startBar.y; 
                                    const endX = endBar.x;
                                    const endY = endBar.y;
                                    
                                    ctx.save();
                                    
                                    // Line Style: High contrast dashed line (Dotted to avoid blending with bars)
                                    ctx.beginPath();
                                    ctx.moveTo(startX, startY);
                                    ctx.lineTo(endX, endY);
                                    ctx.lineWidth = 2;
                                    ctx.setLineDash([6, 4]); 
                                    // Use distinct color (White/Gray) to contrast against Red/Blue bars
                                    ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.6)' : 'rgba(50, 50, 50, 0.6)';
                                    ctx.stroke();

                                    // 3. Draw Percentage Badge in the middle
                                    const midX = (startX + endX) / 2;
                                    const midY = (startY + endY) / 2;
                                    const percentage = profitData.actualRate;
                                    const text = `${percentage >= 0 ? '▲' : '▼'} ${Math.abs(percentage).toFixed(1)}%`;
                                    
                                    ctx.font = 'bold 12px Pretendard';
                                    const textMetrics = ctx.measureText(text);
                                    const boxWidth = textMetrics.width + 16;
                                    const boxHeight = 24;
                                    const bx = midX - boxWidth / 2;
                                    const by = midY - boxHeight / 2;
                                    
                                    // Shadow for separation
                                    ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
                                    ctx.shadowBlur = 6;
                                    ctx.shadowOffsetY = 3;

                                    // Badge Background
                                    // 다크모드에서는 흰색 배경(가독성↑), 라이트모드에서는 진한 회색 배경
                                    ctx.fillStyle = isDark ? '#FFFFFF' : '#2C2C2E';
                                    if (ctx.roundRect) ctx.roundRect(bx, by, boxWidth, boxHeight, 12);
                                    else ctx.fillRect(bx, by, boxWidth, boxHeight);
                                    ctx.fill();
                                    
                                    ctx.shadowColor = "transparent";

                                    // Badge Border (Colored by trend) - 테두리로 상승/하락 구분
                                    ctx.lineWidth = 1.5;
                                    ctx.strokeStyle = percentage >= 0 ? '#FF3B30' : '#0071E3'; 
                                    ctx.stroke();

                                    // Badge Text (Contrast)
                                    // 배경색에 맞춰 글자색 반전 (다크모드 배경엔 검은글씨, 라이트모드 배경엔 흰글씨)
                                    ctx.fillStyle = isDark ? '#000000' : '#FFFFFF'; 
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.fillText(text, midX, midY + 1);

                                    ctx.restore();
                                }
                            }
                        }
                    ]
                });

                                                        <label className="text-[10px] text-gray-400 block mb-0.5">임대 소득</label>
                                                        <input type="text" className="apple-input !py-1 !text-sm !bg-white dark:!bg-white/10" value={simInputs.rentalIncome} onChange={e=>handleCommaChange(e, v=>setSimInputs({...simInputs, rentalIncome: v}))} />
                                                    </div>
                                                    {/* 매매 수익 입력창 추가 */}
                                                    <div>
                                                        <label className="text-[10px] text-gray-400 block mb-0.5">매매 수익</label>
                                                        <input type="text" className="apple-input !py-1 !text-sm !bg-white dark:!bg-white/10" value={simInputs.tradingProfit} onChange={e=>handleCommaChange(e, v=>setSimInputs({...simInputs, tradingProfit: v}))} />
                                                    </div>
                                                </div>
                                                <div className="text-right mt-2">
                                                     <span className="text-[10px] text-gray-400 mr-2">합계:</span>
                                                    <span className="text-sm font-bold text-indigo-600 dark:text-indigo-400">
                                                        {/* 합계 계산에 tradingProfit 포함 */}
                                                        {formatNumber(parseFormattedNumber(simInputs.ipoProfit) + parseFormattedNumber(simInputs.otherIncome) + parseFormattedNumber(simInputs.stockLending) + parseFormattedNumber(simInputs.rentalIncome) + parseFormattedNumber(simInputs.tradingProfit || "0"))}원
                                                     </span>
                                                </div>
                                            </div>
                                    </div>

                                    {/* Target */}
                                    <div>
                                        <label className="text-[10px] text-indigo-500 font-bold block mb-1">95세 목표 잔액 (원)</label>
                                        <input type="text" className="apple-input !bg-indigo-50 dark:!bg-indigo-900/20 text-indigo-700 dark:text-indigo-300" value={simInputs.targetLegacy} onChange={e=>handleCommaChange(e, v=>setSimInputs({...simInputs, targetLegacy: v}))}/>
                                    </div>
                                </div>
                            </AppleCard>
                        </div>
                    </div>

                    {/* Simulation Results Banner */}
                    <div className={`relative overflow-hidden p-6 sm:p-8 rounded-3xl text-white shadow-xl transition-all duration-500 ${simResult.summary?.isSuccess ? 'bg-gradient-to-br from-[#34C759] to-[#30B34F]' : 'bg-gradient-to-br from-[#FF3B30] to-[#FF2D55]'}`}>
                        <div className="relative z-10 flex flex-col sm:flex-row items-center justify-between gap-6 text-center sm:text-left">
                            <div>
                                <h3 className="text-sm font-bold text-white/80 uppercase tracking-wide mb-1">95세 시점 예상 자산</h3>
                                <div className="text-4xl sm:text-5xl font-black tracking-tight mb-2">
                                    {simResult.summary?.depletion ? 
                                        <span className="text-yellow-200">{simResult.summary.depletion}세 자산 고갈 ⚠️</span> : 
                                        <span>{formatNumber(simResult.summary?.final)}원</span>
                                    }
                                </div>
                                <p className="text-sm font-medium text-white/80 bg-black/10 inline-block px-3 py-1 rounded-full">
                                    {simResult.summary?.isSuccess ? "✅ 안정적인 노후 생활이 가능합니다." : "🚨 목표 대비 자금이 부족합니다. 지출 축소나 추가 수입이 필요합니다."}
                                </p>
                            </div>
                            <div className="bg-white/20 backdrop-blur-sm p-4 rounded-2xl min-w-[200px] text-right">
                                <div className="mb-2">
                                    <span className="block text-xs font-bold text-white/70">초기 자산 합계</span>
                                    <span className="block text-xl font-bold">{formatNumber(simResult.summary?.initial * ONE_HUNDRED_MILLION)}원</span>
                                </div>
                                <div>
                                    <span className="block text-xs font-bold text-white/70">예상 총 납부 세금</span>
                                    <span className="block text-xl font-bold text-yellow-300">{formatNumber(simResult.summary?.tax)}원</span>
                                </div>
                            </div>
                        </div>
                        {/* Background Decor */}
                        <i className={`fa-solid ${simResult.summary?.isSuccess ? 'fa-sack-dollar' : 'fa-triangle-exclamation'} absolute -bottom-6 -right-6 text-[150px] text-white/10`}></i>
                    </div>

                    {/* Chart Section */}
                    <AppleCard title="자산 흐름 그래프" subTitle="연령별 자산 변화 추이">
                        <div className="h-[350px] sm:h-[450px]">
                            <SimulationChart history={simResult.history} />
                        </div>
                    </AppleCard>

                    {/* Table Section */}
                    <div className="mt-6 bg-white dark:bg-slate-800 p-3 rounded-xl border dark:border-slate-700 shadow-sm relative">
                        {/* ... Table Header & Controls (Preserved Logic) ... */}
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                            <h3 className="text-sm font-black text-slate-900 dark:text-white flex items-center gap-2">
                                <i className="fa-solid fa-table text-indigo-500"></i>
                                연령별 상세 자금 흐름 분석
                            </h3>
                            <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                                <button onClick={() => setShowTableDetails(!showTableDetails)} className={`w-full sm:w-auto px-3 py-1.5 rounded-lg text-xs font-black flex items-center justify-center gap-2 transition-all shadow-sm border ${showTableDetails ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-white dark:bg-slate-700 text-slate-700 dark:text-white border-slate-300 dark:border-slate-600'}`}>
                                    <i className={`fa-solid ${showTableDetails ? 'fa-eye' : 'fa-eye-slash'}`}></i> 상세 내역 {showTableDetails ? 'ON' : 'OFF'}
                                </button>
                                <div className="relative w-full sm:w-auto">
                                    <button onClick={() => setIsSimColMenuOpen(!isSimColMenuOpen)} className="w-full sm:w-auto bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 px-3 py-1.5 rounded-lg text-xs font-black flex items-center justify-center gap-2 hover:bg-slate-200 dark:hover:bg-slate-600 !text-black dark:!text-white transition-all"><i className="fa-solid fa-gear"></i> 항목 선택</button>
                                    {isSimColMenuOpen && (
                                        <div className="absolute right-0 bottom-12 sm:bottom-auto sm:top-10 z-20 w-48 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-xl shadow-2xl p-4 animate-fade-in">
                                            <h4 className="text-[10px] font-black mb-3 border-b pb-2 dark:text-white">표시할 항목</h4>
                                            <div className="space-y-2">
                                                {[{id: 'taxable', l: '종합과세 대상'}, {id: 'exempt', l: '비과세/분리수익'}, {id: 'income', l: '기타수입/연금'}, {id: 'expense', l: '총 지출'}, {id: 'flow', l: '현금흐름/증감'}, {id: 'status', l: '상태'}].map(col => (
                                                    <label key={col.id} className="flex items-center gap-2 cursor-pointer group"><input type="checkbox" className="w-3 h-3 rounded text-indigo-600 focus:ring-indigo-500" checked={simTableVisibleCols[col.id]} onChange={() => setSimTableVisibleCols({...simTableVisibleCols, [col.id]: !simTableVisibleCols[col.id]})}/><span className="text-[11px] font-bold text-slate-600 dark:text-slate-300 group-hover:text-indigo-600">{col.l}</span></label>
                                                ))}
                                            </div>
                                            <button onClick={() => setIsSimColMenuOpen(false)} className="mt-4 w-full bg-indigo-600 text-white py-1.5 rounded-lg text-[10px] font-black">확인</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* 범례(Legend) */}
                        <div className="mb-3 px-1 flex flex-wrap gap-x-3 gap-y-2 text-[10px] font-bold text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-700/30 p-2 rounded-lg border border-slate-100 dark:border-slate-600/50">
                            <span className="text-slate-400 dark:text-slate-500 mr-1 flex items-center"><i className="fa-solid fa-circle-info mr-1"></i>잔고 구성:</span>
                            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-red-500 shadow-sm"></span>본인일반</div>
                            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-amber-500 shadow-sm"></span>배우자일반</div>
                            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-purple-500 shadow-sm"></span>공모주</div>
                            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500 shadow-sm"></span>본인ISA</div>
                            <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-blue-500 shadow-sm"></span>배우자ISA</div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-[11px] sm:text-[12px] text-left border-collapse table-auto min-w-max">
                                <thead className="bg-slate-100 dark:bg-slate-900 sticky top-0 z-10">
                                    <tr className="text-slate-900 dark:text-white font-black leading-tight">
                                            <th className="px-2 py-3 border-b dark:border-slate-700 text-center sticky left-0 bg-slate-100 dark:bg-slate-900 z-20">나이</th>
                                            <th className="px-2 py-3 border-b dark:border-slate-700 text-center">총자산(억)</th>
                                            <th className="px-2 py-3 border-b dark:border-slate-700 text-center">잔고상세</th>
                                            {simTableVisibleCols.taxable && <th className="px-2 py-3 border-b dark:border-slate-700 text-indigo-600 dark:text-indigo-400 text-right">종합과세 대상(원)</th>}
                                            {simTableVisibleCols.exempt && <th className="px-2 py-3 border-b dark:border-slate-700 text-emerald-600 dark:text-emerald-400 text-right">비과세/분리수익(원)</th>}
                                            {simTableVisibleCols.income && <th className="px-2 py-3 border-b dark:border-slate-700 text-blue-600 dark:text-blue-300 text-right">기타수입/연금(원)</th>}
                                            {simTableVisibleCols.expense && <th className="px-2 py-3 border-b dark:border-slate-700 text-rose-600 dark:text-rose-400 text-right">총 지출(원)</th>}
                                            {simTableVisibleCols.flow && <><th className="px-2 py-3 border-b dark:border-slate-700 text-center">흐름%</th><th className="px-2 py-3 border-b dark:border-slate-700 text-right">연간증감(원)</th></>}
                                            {simTableVisibleCols.status && <th className="px-2 py-3 border-b dark:border-slate-700 text-center">상태</th>}
                                    </tr>
                                </thead>
                                <tbody className="bg-white dark:bg-slate-800">
                                    {simResult.history.map((h, idx) => {
                                        const totalExpense = h.living + h.tax;                                  const cashFlowIndex = totalExpense > 0 ? (h.annualProfit / totalExpense) * 100 : 0;                                  const rowBgClass = h.isHighCost ? 'bg-amber-50 dark:bg-amber-900/30' : h.isWarn ? 'bg-rose-50/70 dark:bg-rose-900/60' : '';
                                        return (
                                            <tr key={idx} className={`hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors border-b dark:border-slate-700 ${rowBgClass}`}>
                                                <td className="px-2 py-2.5 font-black text-slate-900 dark:text-white text-center sticky left-0 bg-inherit z-10 border-r dark:border-slate-700">{h.age}</td>
                                                <td className={`px-2 py-2.5 font-black text-center ${h.isWarn ? 'text-rose-600 dark:text-rose-300' : 'text-indigo-600 dark:text-indigo-300'}`}>{h.total.toFixed(2)}</td>
                                                <td className="px-2 py-2.5">
                                                    <div className="flex justify-center gap-1 mb-1">
                                                        <div className={`w-2 h-2 rounded-full ${h.un > 0 ? 'bg-red-500 shadow-sm' : 'bg-slate-200 dark:bg-slate-700'}`}></div>
                                                        <div className={`w-2 h-2 rounded-full ${h.sn > 0 ? 'bg-amber-500 shadow-sm' : 'bg-slate-200 dark:bg-slate-700'}`}></div>
                                                        <div className={`w-2 h-2 rounded-full ${h.cip > 0 ? 'bg-purple-500 shadow-sm' : 'bg-slate-200 dark:bg-slate-700'}`}></div>
                                                        <div className={`w-2 h-2 rounded-full ${h.si > 0 ? 'bg-blue-500 shadow-sm' : 'bg-slate-200 dark:bg-slate-700'}`}></div>
                                                        <div className={`w-2 h-2 rounded-full ${h.ui > 0 ? 'bg-emerald-500 shadow-sm' : 'bg-slate-200 dark:bg-slate-700'}`}></div>
                                                    </div>
                                                    {showTableDetails && (
                                                        <div className="text-[8px] text-slate-500 dark:text-slate-400 font-normal leading-tight border-t dark:border-slate-700 pt-1 mt-1 space-y-0.5 animate-fade-in">
                                                              <div className="flex justify-between gap-4"><span>본인일반:</span><span className="font-bold text-slate-700 dark:text-slate-200">{formatNumber(h.un)}</span></div>
                                                            <div className="flex justify-between gap-4"><span>배우자일반:</span><span className="font-bold text-slate-700 dark:text-slate-200">{formatNumber(h.sn)}</span></div>
                                                            <div className="flex justify-between gap-4"><span>공모주:</span><span className="font-bold text-slate-700 dark:text-slate-200">{formatNumber(h.cip)}</span></div>
                                                            <div className="flex justify-between gap-4"><span>배우자ISA:</span><span className="font-bold text-slate-700 dark:text-slate-200">{formatNumber(h.si)}</span></div>
                                                            <div className="flex justify-between gap-4"><span>본인ISA:</span><span className="font-bold text-slate-700 dark:text-slate-200">{formatNumber(h.ui)}</span></div>
                                                        </div>
                                                    )}
                                                </td>
                                                {simTableVisibleCols.taxable && <td className={`px-2 py-2.5 font-black num-font text-right ${h.taxableProfit > 20000000 ? 'text-red-500 underline' : 'text-indigo-600 dark:text-indigo-200'}`}><div className={`${showTableDetails ? 'text-[10px] mb-1' : 'text-xs'}`}>{formatNumber(h.taxableProfit)}</div>{showTableDetails && <div className="text-[8px] opacity-70 leading-tight border-t dark:border-slate-600 mt-1 pt-1 font-normal animate-fade-in">본인: {formatNumber(h.details.taxable.u)}<br/>배우자: {formatNumber(h.details.taxable.s)}<br/>CMA: {formatNumber(h.details.taxable.c)}</div>}</td>}
                                                {simTableVisibleCols.exempt && <td className="px-2 py-2.5 text-emerald-600 dark:text-emerald-200 font-black num-font text-right"><div className={`${showTableDetails ? 'text-[10px] mb-1' : 'text-xs'}`}>{formatNumber(h.separateExemptProfit)}</div>{showTableDetails && <div className="text-[8px] opacity-70 leading-tight border-t dark:border-slate-600 mt-1 pt-1 font-normal animate-fade-in">공모주: {formatNumber(h.details.exempt.i)}<br/>본인ISA: {formatNumber(h.details.exempt.ui)}<br/>배우자ISA: {formatNumber(h.details.exempt.si)}</div>}</td>}
                                                {simTableVisibleCols.income && <td className="px-2 py-2.5 text-blue-600 dark:text-blue-300 font-black num-font text-right"><div className={`${showTableDetails ? 'text-[10px] mb-1' : 'text-xs'}`}>{formatNumber(h.baseIncome)}</div>{showTableDetails && <div className="text-[8px] opacity-70 leading-tight border-t dark:border-slate-600 mt-1 pt-1 font-normal animate-fade-in">공적연금: {formatNumber(h.details.income.p)}<br/>기타수입: {formatNumber(h.details.income.o)}</div>}</td>}
                                                {/* 수정됨: 총 지출(expense) 열에 상세 내역 표시 로직 추가 */}
                                                {simTableVisibleCols.expense && (
                                                    <td className="px-2 py-2.5 num-font text-rose-600 dark:text-rose-400 font-black text-right">
                                                        <div className={`${showTableDetails ? 'text-[10px] mb-1' : 'text-xs'}`}>
                                                            {formatNumber(totalExpense)}
                                                        </div>
                                                        {showTableDetails && (
                                                            <div className="text-[8px] opacity-70 leading-tight border-t dark:border-slate-600 mt-1 pt-1 font-normal animate-fade-in">
                                                                생활비: {formatNumber(h.details.expense.l)}<br/>
                                                                {h.details.expense.m > 0 && <>의료/간병: {formatNumber(h.details.expense.m)}<br/></>}
                                                                {h.details.expense.r > 0 && <>건보료: {formatNumber(h.details.expense.r)}<br/></>}
                                                                세금: {formatNumber(h.details.expense.t)}
                                                            </div>
                                                        )}
                                                    </td>
                                                )}
                                                {simTableVisibleCols.flow && (
                                                    <>
                                                        <td className={`px-2 py-2.5 font-black text-center ${cashFlowIndex >= 100 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                            {cashFlowIndex.toFixed(0)}%
                                                        </td>
                                                        <td className={`px-2 py-2.5 font-black text-right num-font ${h.netChange >= 0 ? 'text-blue-600' : 'text-rose-600'}`}>
                                                            {h.netChange > 0 ? '+' : ''}{formatNumber(h.netChange)}
                                                        </td>
                                                    </>
                                                )}
                                                {simTableVisibleCols.status && (
                                                    <td className="px-2 py-2.5 text-center">
                                                        {h.total <= 0 ? (
                                                            <span className="bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-400 px-2 py-0.5 rounded text-[10px] font-black">고갈</span>
                                                        ) : h.netChange >= 0 ? (
                                                            <span className="bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 px-2 py-0.5 rounded text-[10px] font-black">흑자</span>
                                                        ) : (
                                                            <span className="bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-400 px-2 py-0.5 rounded text-[10px] font-black">인출</span>
                                                        )}
                                                    </td>
                                                )}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
            return (
                <div className={`min-h-screen flex flex-col transition-colors duration-200 ${isDark ? 'dark bg-black text-white' : 'bg-[#F5F5F7] text-slate-800'}`}>
                    <header className="sticky top-0 z-50 bg-white/80 dark:bg-[#1C1C1E]/80 backdrop-blur-xl border-b dark:border-white/10 shadow-sm h-16">
                        <div className="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
                            <div className="flex items-center gap-2 font-black text-xl flex-shrink-0 tracking-tighter"><i className="fa-solid fa-layer-group text-[#0071E3]"></i> <span className="hidden sm:inline text-black dark:text-white">INVESTMENT NAVIGATOR</span></div>
                            <div className="nav-container flex-1 mx-4">
                                <nav className="inline-flex bg-[#F2F2F7] dark:bg-[#2C2C2E] p-1 rounded-full gap-1">
                                    {[{id:'dashboard',l:'대시보드'},{id:'routine',l:'루틴'},{id:'tools',l:'도구'},{id:'simulation',l:'노후자금'},{id:'tax',l:'금융과세'}].map(t => (
                                        <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`nav-tab px-4 py-1.5 text-xs rounded-full transition-all duration-300 ${activeTab === t.id ? 'active bg-white dark:bg-[#1C1C1E] text-black dark:text-white shadow-sm' : 'text-gray-500 dark:text-gray-400 font-bold hover:text-black dark:hover:text-white'}`}>{t.l}</button>
                                    ))}
                                </nav>
                            </div>
                            <button onClick={()=>setIsDark(!isDark)} className="w-9 h-9 rounded-full bg-[#F2F2F7] dark:bg-[#2C2C2E] hover:bg-gray-200 dark:hover:bg-gray-700 transition flex items-center justify-center flex-shrink-0"><i className={`fa-solid ${isDark?'fa-sun text-yellow-400':'fa-moon text-[#0071E3]'}`}></i></button>
                        </div>
                    </header>
                    <main className="max-w-7xl w-full mx-auto px-4 py-8 flex-1 overflow-x-hidden">
                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'routine' && renderRoutine()}
                        {activeTab === 'tools' && renderTools()}
                        {activeTab === 'simulation' && renderSimulation()}
                        {activeTab === 'tax' && renderFinancialTax()}
                    </main>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
