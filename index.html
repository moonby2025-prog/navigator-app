        ::-webkit-scrollbar { width: 20px; height: 20px; }
        ::-webkit-scrollbar-thumb { 
            background-color: #8E8E93; 
            border-radius: 10px; 
            border: 5px solid transparent; /* 투명 테두리를 두어 둥근 느낌은 유지하되 */
            background-clip: content-box;  /* 실제 클릭 영역은 20px 전체가 되도록 설정 */
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: #636366; /* 호버 시 색상 진하게 */
            border: 4px solid transparent; /* 호버 시 알맹이를 살짝 더 키움 */

            background-clip: content-box;
        }

        /* --- Apple UI System Styles --- */
        .apple-card { 
            background-color: #ffffff; 
            border-radius: 20px; 
            padding: 24px; 
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04); 
            border: 1px solid rgba(0,0,0,0.04); 
            transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }
        .dark .apple-card {

            border: 1px solid rgba(255,255,255,0.08); 
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25); 
        }
        
        .apple-input { 
            width: 100%; 
            background-color: #F2F2F7; 
            border: none; 
            border-radius: 10px; 
            padding: 12px 14px; 
            font-size: 15px; 
            font-weight: 600; 
            color: #1D1D1F; 
            text-align: right; 
            outline: none; 
            transition: all 0.2s; 
        }
        .dark .apple-input { 
            background-color: #2C2C2E; 
            color: #FFFFFF; 
        }
        .apple-input:focus { 
            box-shadow: 0 0 0 2px #0071E3; 
            background-color: #FFFFFF; 
        }
        .dark .apple-input:focus { 
            background-color: #3A3A3C; 
        }

        .apple-stat-label { 
            font-size: 13px; 
            font-weight: 600; 
            color: #86868B; 
            margin-bottom: 4px; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dark .apple-stat-label { color: #9ca3af; }
        
        .apple-stat-value { 
            font-size: 20px; 
            font-weight: 700; 
            letter-spacing: -0.5px;
            word-break: break-word; 
        }
        @media (min-width: 640px) {
            .apple-stat-value { font-size: 24px; }
        }
        
        .nav-tab { font-weight: 600; color: #86868B; }
        .dark .nav-tab { color: #98989D; }
        
        .nav-tab.active { 
            background-color: #FFFFFF; 
            color: #000000; 
            font-weight: 700; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.12); 
        }
        .dark .nav-tab.active { 
            background-color: #636366; 
            color: #FFFFFF; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .nav-container { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .nav-container::-webkit-scrollbar { display: none; }
        .ticker-fallback { display: flex; white-space: nowrap; overflow: hidden; align-items: center; height: 100%; width: 100%; }
        .num-font { font-variant-numeric: tabular-nums; }

        .text-stat-neutral { color: #1D1D1F; }

        const calculateProgressiveIncomeTax = (income, rates) => {
            if (income <= 0) return 0;
            const threshold1 = 40000000;
            const threshold2 = 80000000;
            let tax = 0;
            const income1 = Math.min(income, threshold1);
            tax += income1 * (rates.rate1 / 100);
            if (income > threshold1) {
                const income2 = Math.min(income, threshold2) - threshold1;
                tax += income2 * (rates.rate2 / 100);
            }
            if (income > threshold2) {
                const income3 = income - threshold2;
                tax += income3 * (rates.rate3 / 100);
            }
            return Math.max(0, tax);
        };

                const getAdjPension = (base, strategy) => { let ageAdj = 0; let mult = 1.0; if (strategy.startsWith('early')) { const y = parseInt(strategy.replace('early', '')); ageAdj = -y; mult = 1 - (y * 0.06); } else if (strategy.startsWith('defer')) { const y = parseInt(strategy.replace('defer', '')); ageAdj = y; mult = 1 + (y * 0.072); } return { start: 65 + ageAdj, amt: base * mult }; };
                const userPen = getAdjPension(parseFormattedNumber(s.pensionSelf), s.pensionStrategyUser); const spousePen = getAdjPension(parseFormattedNumber(s.pensionSpouse), s.pensionStrategySpouse);
                const initOtherTotal = parseFormattedNumber(s.ipoProfit) + parseFormattedNumber(s.otherIncome) + parseFormattedNumber(s.stockLending) + parseFormattedNumber(s.rentalIncome) + parseFormattedNumber(s.tradingProfit || "0");
                let history = []; let totalTaxAccum = 0; let depletionYear = null; const period = Math.max(1, 96 - s.simulationStartAge);
                for (let year = 1; year <= period; year++) {
                    const age = s.simulationStartAge + year - 1; const spouseAge = age - ageDiff;

                    const startTotalAssets = cUserNon + cSpouseNon + cUserISA + cSpouseISA + cIPO;
                    const grossUserNon = cUserNon * (s.returnUserNonISA / 100); const grossSpouseNon = cSpouseNon * (s.returnSpouseNonISA / 100); const ipoCmaProfit = cIPO * (s.returnCMA / 100); const ipoCapitalProfit = cIPO * (s.returnIPO / 100); const grossUserISA = cUserISA * (s.returnUserISA / 100); const grossSpouseISA = cSpouseISA * (s.returnSpouseISA / 100);
                    const taxableProfitYear = grossUserNon + grossSpouseNon + ipoCmaProfit; const exemptProfitYear = ipoCapitalProfit + grossUserISA + grossSpouseISA;
                    const netProfUserNon = grossUserNon * 0.846; const netProfSpouseNon = grossSpouseNon * 0.846; const netProfUserISA = grossUserISA * 0.901; const netProfSpouseISA = grossSpouseISA * 0.901; const netProfIPO = (ipoCmaProfit * 0.846) + ipoCapitalProfit;
                    const totalNetInvestmentProfit = netProfUserNon + netProfSpouseNon + netProfUserISA + netProfSpouseISA + netProfIPO;
                    let weight = 1.0; let lateLifeMedicalAnnual = 0;
                    if (age >= Math.min(userPen.start, spousePen.start)) { if (age < s.highCostStartAge - 5) weight = 1.1; else if (age < s.highCostStartAge) weight = 0.9; else { weight = 0.7; lateLifeMedicalAnnual = medicalCostMonthly * 12 * lInf; } }
                    const basicLivingAnnual = initLiving * lInf * weight;
                    let regionalInsAnnual = 0; if (age >= (s.regionalInsStartAge || 60)) { regionalInsAnnual = regionalInsMonthly * 12 * lInf; }
                    const annualLivingCost = basicLivingAnnual + lateLifeMedicalAnnual + regionalInsAnnual + extraReserveValue;

                                                    <div className="grid grid-cols-2 gap-2">
                                                        <div><label className="text-[9px] text-gray-400 mb-0.5 block">공모주 수익</label><input className="apple-input" value={tempSimInputs.ipoProfit} onChange={e=>handleCommaChange(e, v=>setTempSimInputs({...tempSimInputs, ipoProfit:v}))} /></div>
                                                        <div><label className="text-[9px] text-gray-400 mb-0.5 block">기타 잡수익</label><input className="apple-input" value={tempSimInputs.otherIncome} onChange={e=>handleCommaChange(e, v=>setTempSimInputs({...tempSimInputs, otherIncome:v}))} /></div>
                                                        <div><label className="text-[9px] text-gray-400 mb-0.5 block">대여금 이자</label><input className="apple-input" value={tempSimInputs.stockLending} onChange={e=>handleCommaChange(e, v=>setTempSimInputs({...tempSimInputs, stockLending:v}))} /></div>
                                                        <div><label className="text-[9px] text-gray-400 mb-0.5 block">임대 소득</label><input className="apple-input" value={tempSimInputs.rentalIncome} onChange={e=>handleCommaChange(e, v=>setTempSimInputs({...tempSimInputs, rentalIncome:v}))} /></div>
                                                        <div><label className="text-[9px] text-gray-400 mb-0.5 block">매매 차익</label><input className="apple-input" value={tempSimInputs.tradingProfit} onChange={e=>handleCommaChange(e, v=>setTempSimInputs({...tempSimInputs, tradingProfit:v}))} /></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* 4. 지출 설정 (Expense) */}
                                        <div className="bg-white dark:bg-[#2C2C2E] p-5 rounded-2xl border border-gray-100 dark:border-white/5 shadow-sm">
                                            <h3 className="text-sm font-black text-slate-800 dark:text-white mb-4 flex items-center gap-2 pb-2 border-b border-slate-100 dark:border-white/5">
                                                <div className="w-6 h-6 rounded-md bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 flex items-center justify-center"><i className="fa-solid fa-cart-shopping text-[10px]"></i></div>
                                                지출 및 비용 (단위: 만원)
                                            </h3>
                                            <div className="space-y-4">
                                                <div><label className="text-[10px] font-bold text-gray-500 dark:text-gray-400 mb-1.5 block">월 기본 생활비</label><input className="apple-input" value={tempSimInputs.monthlyLiving} onChange={e=>handleCommaChange(e, v=>setTempSimInputs({...tempSimInputs, monthlyLiving:v}))} /></div>
                                                <div><label className="text-[10px] font-bold text-gray-500 dark:text-gray-400 mb-1.5 block">월 의료/간병비 (80세 이후 적용)</label><input className="apple-input" value={tempSimInputs.monthlyMedical} onChange={e=>handleCommaChange(e, v=>setTempSimInputs({...tempSimInputs, monthlyMedical:v}))} /></div>
                                                
                                                <div className="bg-orange-50 dark:bg-orange-900/20 p-3 rounded-xl border border-orange-100 dark:border-orange-800/30">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <label className="text-[10px] font-bold text-orange-700 dark:text-orange-400"><i className="fa-solid fa-house-chimney-medical"></i> 지역가입 건보료 (월)</label>
                                                        <button onClick={() => calculateAutoRegionalIns(tempSimInputs, setTempSimInputs)} className="text-[9px] bg-orange-200 dark:bg-orange-800 text-orange-800 dark:text-orange-200 px-2 py-1 rounded hover:bg-orange-300 transition font-bold">자동계산</button>
                                                    </div>
                                                    
                                                    <div className="flex items-center gap-2 mb-2 bg-white/50 dark:bg-black/10 p-1.5 rounded-lg">
                                                        <label className="text-[9px] font-bold text-orange-800 dark:text-orange-300 whitespace-nowrap">납부 시작(직장퇴사):</label>
                                                        <input type="number" className="apple-input !py-1 !text-xs flex-1 !bg-white dark:!bg-white/10 text-center" value={tempSimInputs.regionalInsStartAge || 60} onChange={e=>setTempSimInputs({...tempSimInputs, regionalInsStartAge: Number(e.target.value)})} placeholder="60" />
                                                        <span className="text-[9px] font-bold text-orange-800 dark:text-orange-300">세 부터</span>
                                                    </div>

                                                    <input className="apple-input !bg-white dark:!bg-white/10 mb-2" value={tempSimInputs.monthlyRegionalIns} onChange={e=>handleCommaChange(e, v=>setTempSimInputs({...tempSimInputs, monthlyRegionalIns:v}))} />
                                                    <div className="text-[9px] text-orange-600/70 dark:text-orange-400/70 flex items-center gap-1">
                                                        <span>* 자산가액(억):</span>
                                                        <input type="number" step="0.1" className="w-12 bg-transparent border-b border-orange-300 text-center font-bold outline-none" value={tempSimInputs.housingMarketPrice || 0} onChange={e=>setTempSimInputs({...tempSimInputs, housingMarketPrice: e.target.value})} placeholder="5" />
                                                        <span>(자동계산용)</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Table Section */}
                    <AppleCard title="연령별 상세 자금 흐름" subTitle="시뮬레이션 결과 데이터" className="h-[400px] lg:h-[50vh]">
                        <div className="flex flex-col h-full">
                            <div className="mb-3 px-1 flex justify-between items-center">
                                <div className="flex flex-wrap gap-x-3 gap-y-2 text-[10px] font-bold text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-700/30 p-2 rounded-lg border border-slate-100 dark:border-slate-600/50">
                                    <span className="text-slate-400 dark:text-slate-500 mr-1 flex items-center"><i className="fa-solid fa-circle-info mr-1"></i>잔고 구성:</span>
                                    <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-red-500 shadow-sm"></span>본인일반</div>
                                    <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-amber-500 shadow-sm"></span>배우자일반</div>
                                    <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-purple-500 shadow-sm"></span>공모주</div>
                                    <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500 shadow-sm"></span>본인ISA</div>
                                    <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-blue-500 shadow-sm"></span>배우자ISA</div>
                                </div>
                                
                                <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                                    <button onClick={() => setShowTableDetails(!showTableDetails)} className={`w-full sm:w-auto px-3 py-1.5 rounded-lg text-xs font-black flex items-center justify-center gap-2 transition-all shadow-sm border ${showTableDetails ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-white dark:bg-slate-700 text-slate-700 dark:text-white border-slate-300 dark:border-slate-600'}`}><i className={`fa-solid ${showTableDetails ? 'fa-eye' : 'fa-eye-slash'}`}></i> 상세 내역 {showTableDetails ? 'ON' : 'OFF'}</button>
                                    <div className="relative w-full sm:w-auto">
                                        <button onClick={() => setIsSimColMenuOpen(!isSimColMenuOpen)} className="w-full sm:w-auto bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 px-3 py-1.5 rounded-lg text-xs font-black flex items-center justify-center gap-2 hover:bg-slate-200 dark:hover:bg-slate-600 !text-black dark:!text-white transition-all"><i className="fa-solid fa-gear"></i> 항목 선택</button>
                                        {isSimColMenuOpen && ( <div className="absolute right-0 bottom-12 sm:bottom-auto sm:top-10 z-20 w-48 bg-white dark:bg-slate-800 border dark:border-slate-700 rounded-xl shadow-2xl p-4 animate-fade-in"> <h4 className="text-[10px] font-black mb-3 border-b pb-2 dark:text-white">표시할 항목</h4> <div className="space-y-2"> {[{id: 'taxable', l: '종합과세 대상'}, {id: 'exempt', l: '비과세/분리수익'}, {id: 'income', l: '기타수입/연금'}, {id: 'expense', l: '총 지출'}, {id: 'flow', l: '현금흐름/증감'}, {id: 'status', l: '상태'}].map(col => ( <label key={col.id} className="flex items-center gap-2 cursor-pointer group"><input type="checkbox" className="w-3 h-3 rounded text-indigo-600 focus:ring-indigo-500" checked={simTableVisibleCols[col.id]} onChange={() => setSimTableVisibleCols({...simTableVisibleCols, [col.id]: !simTableVisibleCols[col.id]})}/><span className="text-[11px] font-bold text-slate-600 dark:text-slate-300 group-hover:text-indigo-600">{col.l}</span></label> ))} </div> <button onClick={() => setIsSimColMenuOpen(false)} className="mt-4 w-full bg-indigo-600 text-white py-1.5 rounded-lg text-[10px] font-black">확인</button> </div> )}
                                    </div>
                                    <button onClick={() => setIsSimTableExpanded(true)} className="w-full sm:w-auto px-3 py-1.5 bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 transition flex items-center justify-center gap-1"><i className="fa-solid fa-maximize"></i> 전체화면</button>
                                </div>
                            </div>
                            <div className="flex-1 min-h-0 overflow-hidden relative rounded-xl border border-gray-100 dark:border-white/5">
                                {renderTableContent(false)}
                            </div>
                        </div>
                    </AppleCard>

                    {/* Table Expansion Modal */}
                    {isSimTableExpanded && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in">
                            <div className="bg-white dark:bg-[#1C1C1E] w-full max-w-7xl h-[90vh] rounded-3xl shadow-2xl overflow-hidden flex flex-col relative border border-gray-200 dark:border-white/10">
                                <div className="px-6 py-4 border-b border-gray-100 dark:border-white/5 flex justify-between items-center bg-white dark:bg-[#1C1C1E] flex-shrink-0">
                                    <h2 className="text-xl font-bold text-slate-900 force-dark-white tracking-tight flex items-center gap-2"><i className="fa-solid fa-table text-indigo-500"></i> 연령별 상세 자금 흐름 분석</h2>
                                    <button onClick={() => setIsSimTableExpanded(false)} className="w-10 h-10 rounded-full bg-gray-100 dark:bg-[#2C2C2E] hover:bg-gray-200 dark:hover:bg-[#3A3A3C] flex items-center justify-center transition-colors group"><i className="fa-solid fa-xmark text-lg text-slate-500 group-hover:text-slate-900 dark:text-gray-400 dark:group-hover:text-white"></i></button>
                                </div>
                                <div className="flex-1 overflow-hidden relative bg-white dark:bg-[#1C1C1E]">
                                    {renderTableContent(true)}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            // --- 렌더링 시작 ---
            return (
                <div className={`min-h-screen transition-colors duration-200 ${isDark ? 'dark bg-black' : 'bg-[#F5F5F7]'}`}>
                    <div className="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-8">
                        {/* Header & Navigation */}
                        <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 animate-fade-in">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#0071E3] to-[#005bb5] flex items-center justify-center shadow-lg shadow-blue-500/30">
                                    <i className="fa-solid fa-chart-line text-white text-lg"></i>
                                </div>
                                <div><h1 className="text-2xl font-black tracking-tight text-slate-900 force-dark-white">Investment Navigator</h1><p className="text-xs font-bold text-slate-500 dark:text-slate-400">통합 투자 관리 시스템</p></div>
                            </div>
                            {/* [수정 1] scrollbar-hide 제거 -> 가로 스크롤바 노출 */}
                            <div className="flex items-center gap-4 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                                <div className="flex bg-[#E5E5EA] dark:bg-[#2C2C2E] p-1.5 rounded-2xl">
                                    {['dashboard', 'routine', 'tools', 'simulation'].map(tab => (
                                        <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === tab ? 'bg-white dark:bg-[#636366] text-black force-dark-white shadow-sm scale-105' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'}`}>
                                            {tab === 'dashboard' ? '대시보드' : tab === 'routine' ? '루틴' : tab === 'tools' ? '도구' : '시뮬레이션'}
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setIsDark(!isDark)} className="w-10 h-10 rounded-full bg-white dark:bg-[#2C2C2E] text-slate-900 force-dark-white shadow-sm flex items-center justify-center hover:scale-110 transition-transform flex-shrink-0">
                                    <i className={`fa-solid ${isDark ? 'fa-sun text-yellow-400' : 'fa-moon text-slate-400'}`}></i>
                                </button>
                            </div>
                        </header>

                        <main className="min-h-[80vh]">
                            {activeTab === 'dashboard' && renderDashboard()}
                            {activeTab === 'routine' && renderRoutine()}
                            {activeTab === 'tools' && renderTools()}
                            {activeTab === 'simulation' && renderSimulation()}
                        </main>
                        <footer className="text-center py-8 text-[10px] text-gray-400 font-medium">
                            <p>© 2026 Investment Navigator. All data is for reference only.</p>
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
