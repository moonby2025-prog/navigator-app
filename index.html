            if (num === null || num === undefined || isNaN(num) || !isFinite(num)) return '0';

            if (num === null || num === undefined || isNaN(num)) return '0원';

        const parseFormattedNumber = (val) => {
            if (typeof val !== 'string') return typeof val === 'number' ? val : 0;
            return parseFloat(String(val).replace(/,/g, '')) || 0;
        };
        const calculateKgPrice = (don) => (parseFormattedNumber(don) * (1000 / 3.75));
        
        const calculateProgressiveIncomeTax = (income, rates) => {
            if (income <= 0) return 0;
            const threshold1 = 40000000; const threshold2 = 80000000;
            let tax = 0;
            const income1 = Math.min(income, threshold1); tax += income1 * (rates.rate1 / 100);
            if (income > threshold1) { const income2 = Math.min(income, threshold2) - threshold1; tax += income2 * (rates.rate2 / 100); }
            if (income > threshold2) { const income3 = income - threshold2; tax += income3 * (rates.rate3 / 100); }
            return Math.max(0, tax);
        };

        const BridgeChart = memo(({ data, labels, colors, percents, growthRate, isDark, qty }) => {
            const canvasRef = useRef(null); 
            const chartRef = useRef(null);
            useEffect(() => {
                // GUARD: Check if Chart is available
                if (typeof Chart === 'undefined' || !canvasRef.current || !data) return;
                
                if (chartRef.current) chartRef.current.destroy();
                const ctx = canvasRef.current.getContext('2d');
                
                const safeData = data.map(d => { if (Array.isArray(d)) return [d[0] || 0, d[1] || 0]; return d || 0; });

                try {
                    chartRef.current = new Chart(ctx, {

                const unitValAtBuyExch = curUsd * avgExch * factor;
                const unitValAtCurExch = curUsd * curExch * factor; 
                const unitActualVal = curDomestic * unitMult;

                                            <button key={tool.id} onClick={() => setActiveTool(tool.id)} className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-xs md:text-sm font-bold whitespace-nowrap transition-all flex-1 justify-center ${activeTool === tool.id ? 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'}`}><i className={`fa-solid ${tool.icon}`}></i>{tool.label}</button>
                                         ))}
                                    </div>
                                    <div className="flex-1 overflow-y-auto custom-scrollbar pb-4">
                                        <div className="max-w-2xl mx-auto">
                                            {activeTool === 'target' && (
                                                <AppleCard title="주식 목표가 계산기" subTitle="시총 비례 또는 지정가 분석">
                                                    <div className="space-y-6">
                                                        <div className="flex bg-gray-100 dark:bg-[#2C2C2E] rounded-xl p-1 border border-gray-200 dark:border-white/5">
                                                            <button onClick={() => setTargetInputs({ ...targetInputs, mode: 'cap' })} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${targetInputs.mode === 'cap' ? 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm' : 'text-gray-400 hover:text-gray-600'}`}>시총 비례</button>
                                                            <button onClick={() => setTargetInputs({ ...targetInputs, mode: 'price' })} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${targetInputs.mode === 'price' ? 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm' : 'text-gray-400 hover:text-gray-600'}`}>가격 직접</button>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-6">
                                                            <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">현재가</label><input className="apple-input bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 !py-3 !text-base" placeholder="0" value={targetInputs.currentPrice} onChange={e => handleCommaChange(e, v => setTargetInputs({ ...targetInputs, currentPrice: v }))} /></div>
                                                            <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">보유 수량</label><input className="apple-input bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 !py-3 !text-base" placeholder="0" value={targetInputs.shares} onChange={e => handleCommaChange(e, v => setTargetInputs({ ...targetInputs, shares: v }))} /></div>
                                                            <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">현재 시총(조)</label><input className="apple-input bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 text-center placeholder-gray-300 !py-3 !text-base" type="number" placeholder="예: 15.5" value={targetInputs.currentCap} onChange={e => setTargetInputs({ ...targetInputs, currentCap: e.target.value })} /></div>
                                                            <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">{targetInputs.mode === 'cap' ? '목표 시총(조)' : '목표 단가'}</label>{targetInputs.mode === 'cap' ? (<input className="apple-input bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 text-center placeholder-gray-300 !py-3 !text-base" type="number" placeholder="예: 30" value={targetInputs.targetCap} onChange={e => setTargetInputs({ ...targetInputs, targetCap: e.target.value })} />) : (<input className="apple-input bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 text-center placeholder-gray-300 !py-3 !text-base" placeholder="0" value={targetInputs.targetPriceInput} onChange={e => handleCommaChange(e, v => setTargetInputs({ ...targetInputs, targetPriceInput: v }))} />)}</div>
                                                        </div>
                                                        <div className="bg-[#F2F4F8] dark:bg-white/5 p-6 rounded-2xl space-y-4">
                                                            <div className="flex justify-between items-center"><span className="text-sm font-bold text-gray-500 dark:text-gray-400">목표 도달 단가</span><div className="flex items-center gap-2"><span className="text-sm font-bold text-red-500">({targetResult.rate.toFixed(1)}%)</span><span className="text-xl font-black text-black dark:text-white">{formatNumber(targetResult.targetPrice)}원</span></div></div>
                                                            {targetInputs.mode === 'price' && (<div className="flex justify-between items-center"><span className="text-sm font-bold text-gray-500 dark:text-gray-400">예상 시가총액</span><span className="text-base font-bold text-black dark:text-white">{targetResult.targetCap ? targetResult.targetCap.toFixed(1) + '조' : '-'}</span></div>)}
                                                            <div className="flex justify-between items-center"><span className="text-sm font-bold text-gray-500 dark:text-gray-400">예상 평가금액</span><span className="text-base font-bold text-black dark:text-white">{formatNumber(targetResult.expectedVal)}원</span></div>
                                                            <div className="h-px bg-gray-200 dark:bg-white/10 w-full my-2"></div>
                                                            <div className="flex justify-between items-center"><span className="text-sm font-bold text-gray-500 dark:text-gray-400">예상 수익금</span><span className="text-2xl font-black text-blue-500">{formatNumber(targetResult.expectedProfit)}원</span></div>
                                                        </div>
                                                    </div>
                                                </AppleCard>
                                            )}
                                            {activeTool === 'ipo' && (
                                                <AppleCard title="IPO/스팩 청약 증거금 계산기" subTitle="청약 수량별 필요 증거금 확인">
                                                    <div className="space-y-6">
                                                        <div className="grid grid-cols-2 gap-6">
                                                            <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">공모가 (원)</label><input className="apple-input bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 text-center !py-3 !text-base" placeholder="2,000" value={ipoCalcInputs.price} onChange={e=>handleCommaChange(e,v=>setIpoCalcInputs({...ipoCalcInputs,price:v}))} /></div>
                                                            <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">청약 수량 (주)</label><input className="apple-input bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 text-center !py-3 !text-base" placeholder="10" value={ipoCalcInputs.qty} onChange={e=>handleCommaChange(e,v=>setIpoCalcInputs({...ipoCalcInputs,qty:v}))} /></div>
                                                        </div>
                                                        <div className="space-y-2">
                                                            <label className="text-xs font-bold text-gray-500 dark:text-gray-400 block">증거금률 선택</label>
                                                            <div className="flex bg-gray-100 dark:bg-[#2C2C2E] rounded-xl p-1 border border-gray-200 dark:border-white/5">
                                                                <button onClick={()=>setIpoCalcInputs({...ipoCalcInputs, marginRate:50})} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${ipoCalcInputs.marginRate===50?'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm':'text-gray-400 hover:text-gray-600'}`}>50% (일반)</button>
                                                                <button onClick={()=>setIpoCalcInputs({...ipoCalcInputs, marginRate:100})} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${ipoCalcInputs.marginRate===100?'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm':'text-gray-400 hover:text-gray-600'}`}>100% (우대/스팩)</button>
                                                            </div>
                                                        </div>
                                                        <div className="bg-[#F2F4F8] dark:bg-white/5 p-6 rounded-2xl space-y-4">
                                                            <div className="flex justify-between items-center"><span className="text-sm font-bold text-gray-500 dark:text-gray-400">총 청약금액</span><span className="text-xl font-black text-black dark:text-white">{formatNumber(parseFormattedNumber(ipoCalcInputs.price)*parseFormattedNumber(ipoCalcInputs.qty))}원</span></div>
                                                            <div className="h-px bg-gray-200 dark:bg-white/10 w-full my-2"></div>
                                                            <div className="flex justify-between items-center"><span className="text-sm font-bold text-black dark:text-white">필요 증거금</span><span className="text-2xl font-black text-blue-600">{formatNumber(parseFormattedNumber(ipoCalcInputs.price)*parseFormattedNumber(ipoCalcInputs.qty)*(ipoCalcInputs.marginRate/100))}원</span></div>
                                                        </div>
                                                    </div>
                                                </AppleCard>
                                            )}
                                            {activeTool === 'exchange' && (
                                                <AppleCard title="실시간 환율 계산기" subTitle="주요 통화 간편 변환">
                                                    <div className="space-y-6">
                                                        <div className="flex gap-4 items-center justify-center py-4">
                                                            <select className="apple-input !w-32 text-center bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 font-bold !py-3 !text-base rounded-xl" value={exchInputs.base} onChange={e=>setExchInputs({...exchInputs, base:e.target.value})}>
                                                                {Object.keys(exchangeRates).sort((a,b) => {
                                                                    const priorities = ['USD', 'KRW', 'JPY', 'CNY', 'EUR'];
                                                                    const idxA = priorities.indexOf(a);
                                                                    const idxB = priorities.indexOf(b);
                                                                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                                                                    if (idxA !== -1) return -1;
                                                                    if (idxB !== -1) return 1;
                                                                    return a.localeCompare(b);
                                                                }).map(k=><option key={k} value={k}>{k}</option>)}
                                                            </select>
                                                            <div className="w-10 h-10 rounded-full bg-gray-100 dark:bg-white/10 flex items-center justify-center text-gray-400"><i className="fa-solid fa-arrow-right"></i></div>
                                                            <select className="apple-input !w-32 text-center bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 font-bold !py-3 !text-base rounded-xl" value={exchInputs.target} onChange={e=>setExchInputs({...exchInputs, target:e.target.value})}>
                                                                {Object.keys(exchangeRates).sort((a,b) => {
                                                                    const priorities = ['KRW', 'USD', 'JPY', 'CNY', 'EUR'];
                                                                    const idxA = priorities.indexOf(a);
                                                                    const idxB = priorities.indexOf(b);
                                                                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                                                                    if (idxA !== -1) return -1;
                                                                    if (idxB !== -1) return 1;
                                                                    return a.localeCompare(b);
                                                                }).map(k=><option key={k} value={k}>{k}</option>)}
                                                            </select>
                                                        </div>
                                                        <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">금액 ({exchInputs.base})</label><input className="apple-input !text-2xl !py-4 bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 font-bold text-center" value={exchInputs.amount} onChange={e=>handleCommaChange(e, v=>setExchInputs({...exchInputs, amount:v}))} /></div>
                                                        <div className="bg-[#F2F4F8] dark:bg-white/5 p-8 rounded-3xl text-center space-y-2">
                                                            <span className="text-sm font-bold text-gray-500 dark:text-gray-400 block mb-2">환산 금액 ({exchInputs.target})</span>
                                                            <span className="text-4xl font-black text-black dark:text-white block">
                                                                {(() => {
                                                                    const amount = parseFormattedNumber(exchInputs.amount);
                                                                    const baseRate = exchangeRates[exchInputs.base] || 1;
                                                                    const targetRate = exchangeRates[exchInputs.target] || 1;
                                                                    const result = amount * (targetRate / baseRate);
                                                                    return result.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                                                                })()}
                                                            </span>
                                                            <span className="text-xs font-bold text-gray-400 block mt-4">
                                                                적용 환율: 1 {exchInputs.base} = {(() => {
                                                                    const baseRate = exchangeRates[exchInputs.base] || 1;
                                                                    const targetRate = exchangeRates[exchInputs.target] || 1;
                                                                    const rate = targetRate / baseRate;
                                                                    return rate.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                                                                })()} {exchInputs.target}
                                                            </span>
                                                        </div>
                                                    </div>
                                                </AppleCard>
                                            )}
                                            {activeTool === 'average' && (
                                                <AppleCard title="평단가 계산기" subTitle="물타기 시뮬레이션">
                                                    <div className="space-y-4">
                                                        <div className="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                                            {avgRows.map((r,i)=>(
                                                                <div key={r.id} className="flex gap-3 items-center bg-gray-50 dark:bg-white/5 p-3 rounded-xl border border-transparent hover:border-gray-200 dark:hover:border-white/10 transition-colors">
                                                                    <div className="w-6 h-6 rounded-full bg-white dark:bg-white/10 flex items-center justify-center text-xs font-bold text-gray-400 shadow-sm">{i+1}</div>
                                                                    <div className="flex-1 grid grid-cols-2 gap-3"><div><label className="text-[10px] text-gray-400 block mb-1 ml-1">수량</label><input className="apple-input !py-2 text-sm bg-white dark:bg-black/20" placeholder="수량" value={r.q} onChange={e=>{const n=[...avgRows]; n[i].q=e.target.value; setAvgRows(n)}} /></div><div><label className="text-[10px] text-gray-400 block mb-1 ml-1">단가</label><input className="apple-input !py-2 text-sm bg-white dark:bg-black/20" placeholder="단가" value={r.p} onChange={e=>{const n=[...avgRows]; n[i].p=e.target.value; setAvgRows(n)}} /></div></div>
                                                                    {avgRows.length > 1 && (<button onClick={()=>{const n=avgRows.filter(row=>row.id!==r.id); setAvgRows(n)}} className="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-red-500 transition"><i className="fa-solid fa-trash text-sm"></i></button>)}
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <button onClick={()=>setAvgRows([...avgRows,{id:Date.now(),q:'',p:''}])} className="w-full py-3 bg-gray-100 dark:bg-white/10 rounded-xl text-sm font-bold text-gray-500 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-white/20 transition flex items-center justify-center gap-2"><i className="fa-solid fa-plus"></i> 추가하기</button>
                                                        <div className="bg-[#F2F4F8] dark:bg-white/5 p-6 rounded-2xl mt-4">
                                                            <div className="flex justify-between items-end border-b border-gray-200 dark:border-white/10 pb-4 mb-4"><span className="text-sm font-bold text-gray-500 dark:text-gray-400">총 보유 수량</span><span className="text-lg font-bold text-black dark:text-white">{formatNumber(avgResult.totalQ)}주</span></div>
                                                            <div className="flex justify-between items-end"><span className="text-sm font-bold text-gray-500 dark:text-gray-400">평균 단가</span><span className="text-3xl font-black text-blue-600">{formatNumber(avgResult.avg)}원</span></div>
                                                            <div className="mt-2 text-right"><span className="text-xs font-bold text-gray-400">총 매수금액: {formatNumber(avgResult.totalAmt)}원</span></div>
                                                        </div>
                                                    </div>
                                                </AppleCard>
                                            )}
                                            {activeTool === 'unit' && (
                                                <AppleCard title="단위 변환기" subTitle="귀금속 중량 변환">
                                                    <div className="space-y-6">
                                                        <div className="flex bg-gray-100 dark:bg-[#2C2C2E] p-1 rounded-xl border border-gray-200 dark:border-white/5">
                                                            <button onClick={()=>setUnitConv({...unitConv,base:'don'})} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${unitConv.base==='don'?'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm':'text-gray-400'}`}>돈 (don)</button>
                                                            <button onClick={()=>setUnitConv({...unitConv,base:'gram'})} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${unitConv.base==='gram'?'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm':'text-gray-400'}`}>그램 (g)</button>
                                                            <button onClick={()=>setUnitConv({...unitConv,base:'oz'})} className={`flex-1 text-sm py-2.5 rounded-lg transition-all font-bold ${unitConv.base==='oz'?'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm':'text-gray-400'}`}>온스 (oz)</button>
                                                        </div>
                                                        <div><label className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 block">입력 값 ({unitConv.base})</label><input className="apple-input !text-3xl !py-6 bg-gray-50 dark:bg-black/20 border border-gray-200 dark:border-white/10 font-bold text-center" value={unitConv.value} onChange={e=>setUnitConv({...unitConv,value:e.target.value})} placeholder="0" /></div>
                                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                            {['don','gram','oz','kg'].filter(u=>u!==unitConv.base).map(u=>(
                                                                <div key={u} className="bg-[#F2F4F8] dark:bg-white/5 p-4 rounded-2xl flex flex-col items-center justify-center">
                                                                    <span className="text-xs font-bold text-gray-400 mb-1 uppercase">{u}</span>
                                                                    <span className="text-xl font-bold text-slate-800 dark:text-white">
                                                                        {(()=>{
                                                                            let v=parseFloat(unitConv.value)||0; 
                                                                            if(unitConv.base==='don'){ if(u==='gram')v*=3.75; else if(u==='oz')v*=0.1205; else v*=0.00375; } else if(unitConv.base==='gram'){ if(u==='don')v/=3.75; else if(u==='oz')v/=31.1035; else v/=1000; } else { if(u==='gram')v*=31.1035; else if(u==='don')v*=8.294; else v*=0.0311; } 
                                                                            return v.toLocaleString(undefined,{maximumFractionDigits:4});
                                                                        })()}
                                                                    </span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </AppleCard>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                            
                            {activeTab === 'tax' && (
                                <div className="flex flex-col h-[calc(100vh-140px)]">
                                    <div className="flex justify-center mb-4 shrink-0">
                                        <div className="flex bg-[#E5E5EA] dark:bg-[#2C2C2E] p-1 rounded-xl">
                                            <button onClick={() => setTaxSubTab('settlement')} className={`px-4 py-2 rounded-lg text-xs md:text-sm font-bold transition-all ${taxSubTab === 'settlement' ? 'bg-white dark:bg-[#636366] text-black force-dark-white shadow-sm' : 'text-gray-400'}`}>금융과세 정산</button>
                                            <button onClick={() => setTaxSubTab('retirement')} className={`px-4 py-2 rounded-lg text-xs md:text-sm font-bold transition-all ${taxSubTab === 'retirement' ? 'bg-white dark:bg-[#636366] text-black force-dark-white shadow-sm' : 'text-gray-400'}`}>노후자금</button>
                                        </div>
                                    </div>
                                    <div className="flex-1 overflow-y-auto custom-scrollbar pb-4">
                                        {taxSubTab === 'settlement' && renderFinancialTax()}
                                        {taxSubTab === 'retirement' && renderRetirementSimulation()}
                                    </div>
                                </div>
                            )}
                        </main>

                        <nav className="md:hidden fixed bottom-0 left-0 w-full bg-white/90 dark:bg-[#1C1C1E]/90 backdrop-blur-lg border-t border-gray-200 dark:border-white/10 pb-safe z-40">
                            <div className="flex justify-around items-center h-16 px-2">
                                {[
                                    { id: 'dashboard', icon: 'fa-chart-pie', label: '대시보드' },
                                    { id: 'routine', icon: 'fa-list-check', label: '루틴' },
                                    { id: 'tools', icon: 'fa-calculator', label: '도구' },
                                    { id: 'tax', icon: 'fa-file-invoice-dollar', label: '세금/노후' },
                                ].map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === tab.id ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 dark:text-gray-500'}`}>
                                        <i className={`fa-solid ${tab.icon} text-xl transition-transform ${activeTab === tab.id ? 'scale-110' : ''}`}></i>
                                        <span className="text-[10px] font-bold">{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </nav>

                        {expandedView && (
                            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur flex items-center justify-center p-4">
                                <div className="bg-white dark:bg-[#1C1C1E] w-full max-w-6xl h-[85vh] rounded-2xl flex flex-col overflow-hidden">
                                    <div className="p-3 border-b dark:border-white/10 flex justify-between items-center"><h3 className="font-bold dark:text-white">상세 보기</h3><button onClick={()=>setExpandedView(null)}><i className="fa-solid fa-xmark text-lg dark:text-white"></i></button></div>
                                    <div className="flex-1 p-4 bg-gray-100 dark:bg-black">
                                        {expandedView === 'heatmap' && <TradingViewHeatmap theme={isDark?'dark':'light'} />}
                                        {expandedView === 'calendar' && <IpoCalendarWidget isDark={isDark} />}
                                    </div>
                                </div>
                            </div>
                        )}
                        {isInputModalOpen && renderInputModal()}
                        <Toast message={rateError} visible={!!rateError} onClose={()=>setRateError(null)} />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
